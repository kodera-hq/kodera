[package]
name = "kodera-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared native core with UUIDv7 identifiers, optional OpenMLS/Megolm engines and scoped passkey assertions, plus proximity frame and rotating discovery primitives."

[lib]
name = "kodera_rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
# Optional UniFFI, OpenMLS (RFC 9420), and BLE GATT bindings enabled by mobile/desktop targets.
uniffi-bindings = []
openmls-engine = ["dep:openmls", "dep:openmls_rust_crypto", "dep:openmls_basic_credential", "dep:openmls_traits", "dep:tls_codec", "dep:aes-gcm", "dep:serde_json", "dep:base64"]
megolm-engine = ["dep:vodozemac"]
passkey-bindings = ["dep:p256", "dep:serde", "dep:serde_json", "dep:base64", "dep:getrandom"]
native-crypto = ["openmls-engine", "megolm-engine", "passkey-bindings"]
browser-bindings = ["native-crypto", "dep:wasm-bindgen", "dep:js-sys", "dep:getrandom-legacy", "dep:sha2", "openmls/js", "vodozemac/wasm_js", "getrandom/wasm_js"]
ble-transport = []

# The dependency-free default retains the workspace MSRV. Opt-in native crypto
# requires Rust 1.94, the supported minimum of the backported crypto providers.
[dependencies]
aes-gcm = { version = "=0.11.1", optional = true, default-features = false, features = ["aes"] }
openmls = { version = "=0.9.2", optional = true, default-features = false }
openmls_rust_crypto = { version = "=0.6.0", optional = true }
openmls_basic_credential = { version = "=0.6.0", optional = true }
openmls_traits = { version = "=0.6.0", optional = true }
tls_codec = { version = "0.5", optional = true, features = ["derive", "mls"] }
vodozemac = { version = "=0.11.2", optional = true, default-features = false }
p256 = { version = "=0.14.0", optional = true, default-features = false, features = ["ecdsa", "std"] }
serde = { version = "1.0", optional = true, features = ["derive"] }
serde_json = { version = "1.0", optional = true }
base64 = { version = "0.23", optional = true }
getrandom = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.130", optional = true, default-features = false, features = ["std"] }
js-sys = { version = "=0.3.107", optional = true, default-features = false, features = ["std"] }
getrandom-legacy = { package = "getrandom", version = "=0.2.17", optional = true, features = ["js"] }
sha2 = { version = "=0.11.1", optional = true, default-features = false }
