[workspace]
resolver = "2"
exclude = [
    "security/backports/glib-0.18.5",
    "security/backports/openmls_basic_credential-0.6.0",
    "security/backports/openmls_rust_crypto-0.6.0",
]
members = [
    "packages/kodera-rs",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/kodera-hq/kodera"
homepage = "https://kodera.io"

[patch.crates-io]
glib = { path = "security/backports/glib-0.18.5" }
openmls_basic_credential = { path = "security/backports/openmls_basic_credential-0.6.0" }
openmls_rust_crypto = { path = "security/backports/openmls_rust_crypto-0.6.0" }
