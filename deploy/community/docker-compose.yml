# Kodera Community self-host stack (`KODERA_EDITION=community`, `KODERA_BILLING_ENABLED=false`).
# It runs no identity provider: sign-in uses an OIDC issuer you operate, set by
# KODERA_OIDC_PROVIDER_ORIGIN (web) and KODERA_AUTH_TRUST (server); see README.md, "Sign-in".
# Every pulled image is pinned by digest and every service has a memory limit; the limits are
# ceilings, not a measured footprint. Respects ADR-0003 (`ADMITTED_SECRET_NAMES` on `server`;
# LiveKit credentials isolated in `room-access`). Synapse runs on its own PostgreSQL, with
# federation closed unless KODERA_MATRIX_FEDERATION_ALLOWLIST opens it (README.md, "Federation").
# The agent API (`/agent/*`) is reached on the internal network only, never through Caddy.
# This file runs the `single` topology on its own, and the `split` topology with
# docker-compose.split.yml on top (README.md, "Topologies").
# `scripts/ci/check-community-deploy.py` checks it.

services:
  caddy:
    mem_limit: 128m
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      KODERA_DOMAIN: ${KODERA_DOMAIN:-chat.example.org}
      KODERA_ACME_EMAIL: ${KODERA_ACME_EMAIL:-ops@example.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Caddy does not wait for `web`, which the split topology does not start.
    depends_on:
      server:
        condition: service_healthy
      room-access:
        condition: service_started
      synapse:
        condition: service_healthy
    networks:
      edge:
      api_ingress:
        ipv4_address: ${KODERA_CADDY_API_ADDRESS:-172.30.240.2}

  db:
    mem_limit: 512m
    image: postgres:17.12-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kodera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kodera_server}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kodera} -d ${POSTGRES_DB:-kodera_server}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    mem_limit: 128m
    image: valkey/valkey:8.0-alpine@sha256:19f0b3d350f5e6de618086d79ecdc9c474ab159bebb16ed95a92e4211562fee5
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    mem_limit: 512m
    build:
      context: ../../apps/server
      dockerfile: Dockerfile.migrator
    command:
      - /bin/sh
      - -c
      - |
        python manage.py migrate --noinput --settings config.settings.deploy &&
        python manage.py migrate --noinput --settings config.settings.deploy_operator &&
        python manage.py configure_api_role --settings config.settings.deploy &&
        python manage.py configure_collab_role --settings config.settings.deploy &&
        if [ -n "$$KODERA_DEFAULT_COMMUNITY_ORG_SLUG" ]; then
          python manage.py bootstrap_community_workspace --settings config.settings.deploy
        fi
    restart: "no"
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-${KODERA_DOMAIN:-chat.example.org},127.0.0.1,server}
      KODERA_API_DATABASE_URL: postgresql://kodera_api:${KODERA_API_DATABASE_PASSWORD:?Set the isolated API database password}@db:5432/${POSTGRES_DB:-kodera_server}
      KODERA_COLLAB_DATABASE_URL: postgresql://kodera_collab:${KODERA_COLLAB_DATABASE_PASSWORD:?Set the isolated collaboration database password}@db:5432/${POSTGRES_DB:-kodera_server}
      KODERA_DEFAULT_COMMUNITY_ORG_SLUG: ${KODERA_DEFAULT_COMMUNITY_ORG_SLUG:-}
      KODERA_DEFAULT_COMMUNITY_ISSUER: ${KODERA_DEFAULT_COMMUNITY_ISSUER:-}
      KODERA_DEFAULT_COMMUNITY_OWNER_USER_ID: ${KODERA_DEFAULT_COMMUNITY_OWNER_USER_ID:-}
      KODERA_AUTH_TRUST: ${KODERA_AUTH_TRUST:?Set KODERA_AUTH_TRUST in operator configuration}
      KODERA_STAFF_ISSUER: ${KODERA_STAFF_ISSUER:-}
      KODERA_CONSOLE_CLIENT_ID: ${KODERA_CONSOLE_CLIENT_ID:-${KODERA_OIDC_CLIENT_ID:-console}}
      KODERA_BILLING_ENABLED: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      KODERA_CONTACT_SEAL_KEY: ${KODERA_CONTACT_SEAL_KEY:?Set KODERA_CONTACT_SEAL_KEY in .env}
      KODERA_OUTBOX_SEAL_KEY: ${KODERA_OUTBOX_SEAL_KEY:?Set KODERA_OUTBOX_SEAL_KEY in .env}
      KODERA_MEMBERSHIP_CURSOR_KEY: ${KODERA_MEMBERSHIP_CURSOR_KEY:?Set KODERA_MEMBERSHIP_CURSOR_KEY in .env}
      KODERA_DISCOVERY_HMAC_KEY: ${KODERA_DISCOVERY_HMAC_KEY:?Set KODERA_DISCOVERY_HMAC_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-kodera}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kodera_server}
    depends_on:
      db:
        condition: service_healthy

  # This volume holds only a Unix socket and empty ownership lock; all presence/key data is RAM-only.
  proximity-socket-init:
    mem_limit: 64m
    build:
      context: ../../apps/server
      dockerfile: Dockerfile
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER"]
    security_opt: ["no-new-privileges:true"]
    command: ["python", "-c", "import os; os.chmod('/run/proximity', 0o700); os.chown('/run/proximity', 10001, 10001)"]
    restart: "no"
    volumes:
      - proximity_socket:/run/proximity

  proximity-broker:
    mem_limit: 128m
    build:
      context: ../../apps/server
      dockerfile: Dockerfile
    command: ["python", "-m", "apps.proximity.broker_rpc", "/run/proximity/broker.sock"]
    restart: unless-stopped
    volumes:
      - proximity_socket:/run/proximity
    depends_on:
      proximity-socket-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(1); s.connect('/run/proximity/broker.sock'); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Only this initializer and the signing worker receive the storage credential directory.
  media-socket-init:
    mem_limit: 64m
    build:
      context: ../../apps/server
      dockerfile: Dockerfile
    user: "0:0"
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    command: ["python", "-c", "import os; from pathlib import Path; Path('/run/kodera-media/media.sock').unlink(missing_ok=True); [(os.chmod(p, 0o700), os.chown(p, 10001, 10001)) for p in ('/run/kodera-media', '/run/kodera-media-secrets')]"]
    restart: "no"
    volumes:
      - media_socket:/run/kodera-media
      - ${KODERA_MEDIA_SECRETS_SOURCE:-media_secrets}:/run/kodera-media-secrets

  media-storage-worker:
    mem_limit: 128m
    build:
      context: ../../apps/server
      dockerfile: Dockerfile
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command: ["python", "-m", "apps.media.storage_worker", "--socket", "/run/kodera-media/media.sock", "--secret-directory", "/run/kodera-media-secrets"]
    restart: unless-stopped
    volumes:
      - media_socket:/run/kodera-media
      - ${KODERA_MEDIA_SECRETS_SOURCE:-media_secrets}:/run/kodera-media-secrets:ro
    depends_on:
      media-socket-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(1); s.connect('/run/kodera-media/media.sock'); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 10

  server:
    mem_limit: 768m
    build:
      context: ../../apps/server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      KODERA_EDITION: community
      KODERA_BILLING_ENABLED: "false"
      KODERA_COLLAB_TICKET_KEY: ${KODERA_COLLAB_TICKET_KEY:?Set the application collaboration key}
      KODERA_COLLAB_ENGINE_URL: http://yjs-collab:8098/internal/transform
      KODERA_COLLAB_PUBLIC_URL: wss://${KODERA_DOMAIN:-chat.example.org}/documents/collab
      KODERA_AUTH_TRUST: ${KODERA_AUTH_TRUST:?Set KODERA_AUTH_TRUST in .env (README.md, Sign-in)}
      KODERA_STAFF_ISSUER: ${KODERA_STAFF_ISSUER:-}
      KODERA_CONSOLE_ORIGINS: https://${KODERA_DOMAIN:-chat.example.org}
      KODERA_CONSOLE_CLIENT_ID: ${KODERA_CONSOLE_CLIENT_ID:-${KODERA_OIDC_CLIENT_ID:-console}}
      KODERA_TRUSTED_EDGE_ADDRESSES: ${KODERA_CADDY_API_ADDRESS:-172.30.240.2}/32
      KODERA_DEFAULT_COMMUNITY_ORG_SLUG: ${KODERA_DEFAULT_COMMUNITY_ORG_SLUG:-}
      KODERA_DEFAULT_COMMUNITY_ISSUER: ${KODERA_DEFAULT_COMMUNITY_ISSUER:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-${KODERA_DOMAIN:-chat.example.org},127.0.0.1,server}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      KODERA_CONTACT_SEAL_KEY: ${KODERA_CONTACT_SEAL_KEY:?Set KODERA_CONTACT_SEAL_KEY in .env}
      KODERA_OUTBOX_SEAL_KEY: ${KODERA_OUTBOX_SEAL_KEY:?Set KODERA_OUTBOX_SEAL_KEY in .env}
      KODERA_MEMBERSHIP_CURSOR_KEY: ${KODERA_MEMBERSHIP_CURSOR_KEY:?Set KODERA_MEMBERSHIP_CURSOR_KEY in .env}
      KODERA_DISCOVERY_HMAC_KEY: ${KODERA_DISCOVERY_HMAC_KEY:?Set KODERA_DISCOVERY_HMAC_KEY in .env}
      DATABASE_URL: postgresql://kodera_api:${KODERA_API_DATABASE_PASSWORD:?Set the isolated API database password}@db:5432/${POSTGRES_DB:-kodera_server}
      KODERA_PROXIMITY_BROKER_SOCKET: /run/proximity/broker.sock
      KODERA_MEDIA_GATEWAY_SOCKET: /run/kodera-media/media.sock
      KODERA_IOS_APP_IDS: ${KODERA_IOS_APP_IDS:-}
      KODERA_ANDROID_ASSETLINKS_SHA256: ${KODERA_ANDROID_ASSETLINKS_SHA256:-}
    volumes:
      - proximity_socket:/run/proximity:ro
      # Linux permits connecting to the owner-writable socket inode through a read-only mount.
      - media_socket:/run/kodera-media:ro
    depends_on:
      media-storage-worker:
        condition: service_healthy
      proximity-broker:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      yjs-collab:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      default:
      api_ingress:
        ipv4_address: ${KODERA_SERVER_API_ADDRESS:-172.30.240.3}

  # The only public native route is /documents/collab. The signed transformer stays private.
  yjs-collab:
    mem_limit: 768m
    build:
      context: ../../apps/server/yjs_collab
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://kodera_collab:${KODERA_COLLAB_DATABASE_PASSWORD:?Set the isolated collaboration database password}@db:5432/${POSTGRES_DB:-kodera_server}
      KODERA_COLLAB_TICKET_KEY: ${KODERA_COLLAB_TICKET_KEY:?Set the application collaboration key}
      KODERA_COLLAB_ALLOWED_ORIGINS: https://${KODERA_DOMAIN:-chat.example.org}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8098/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      default:
      edge:

  agent-state-init:
    profiles: [community-governance]
    mem_limit: 64m
    build:
      context: ../../apps/server
      dockerfile: Dockerfile
    user: "0:0"
    command: ["python", "-c", "import os; os.chown('/state', 10001, 10001); os.chmod('/state', 0o700)"]
    restart: "no"
    volumes:
      - agent_state:/state

  tenant-agent:
    profiles: [community-governance]
    mem_limit: 256m
    build:
      context: ../../apps/server
      dockerfile: Dockerfile
    command: ["python", "-m", "tenant_agent", "run"]
    restart: unless-stopped
    environment:
      KODERA_APPS: matrix
      KODERA_CORE_URL: http://server:8000
      KODERA_AGENT_TOKEN: ${KODERA_AGENT_TOKEN:-}
      KODERA_AGENT_STATE_DIR: /state
      KODERA_COMPOSE_PROJECT: community
      KODERA_SYNAPSE_URL: http://synapse:8008
      KODERA_SYNAPSE_TOKEN: ${KODERA_SYNAPSE_TOKEN:-}
      KODERA_MATRIX_SERVER_NAME: ${KODERA_DOMAIN:-chat.example.org}
      KODERA_FEDERATION_MODE: ${KODERA_FEDERATION_MODE:-}
      KODERA_MATRIX_FEDERATION_ALLOWLIST: ${KODERA_MATRIX_FEDERATION_ALLOWLIST:-}
      KODERA_MATRIX_PARTNER_CHANNELS: ${KODERA_MATRIX_PARTNER_CHANNELS:-}
      KODERA_ROOM_ACCESS_USER: "@kodera-rooms:${KODERA_DOMAIN:-chat.example.org}"
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in operator configuration}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in operator configuration}
    volumes:
      - agent_state:/state
    depends_on:
      agent-state-init:
        condition: service_completed_successfully
      server:
        condition: service_healthy
      synapse:
        condition: service_healthy
      livekit:
        condition: service_started

  web:
    mem_limit: 128m
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_CORE_API_URL: https://${KODERA_DOMAIN:-chat.example.org}/api/v1
        VITE_OIDC_CLIENT_ID: ${KODERA_OIDC_CLIENT_ID:-console}
        VITE_KEYCLOAK_URL: ${KODERA_OIDC_PROVIDER_ORIGIN:?Set KODERA_OIDC_PROVIDER_ORIGIN in .env}
        VITE_MATRIX_DOMAIN: ${KODERA_MATRIX_DOMAIN:?Set KODERA_MATRIX_DOMAIN to the tenant base domain}
        VITE_TENANT_DOMAIN: ${KODERA_MATRIX_DOMAIN:?Set KODERA_MATRIX_DOMAIN to the tenant base domain}
    environment:
      KODERA_ATTACHMENT_BASE: ${KODERA_ATTACHMENT_BASE:-}
    entrypoint:
      - "/bin/sh"
      - "-ec"
      - 'if [ -n "$${KODERA_ATTACHMENT_BASE:-}" ]; then set -- "$$@" --attachment-base "$$KODERA_ATTACHMENT_BASE"; fi; exec node /app/static.mjs --root /srv/console --host 0.0.0.0 "$$@"'
      - "sh"
    command:
      - "--port"
      - "8080"
      - "--prefix"
      - "/"
      - "--claim-path"
      - "/claim"
      - "--core-origin"
      - "https://${KODERA_DOMAIN:-chat.example.org}"
      - "--provider-origin"
      - "${KODERA_OIDC_PROVIDER_ORIGIN:?Set KODERA_OIDC_PROVIDER_ORIGIN in .env}"
      - "--matrix-domain"
      - "${KODERA_MATRIX_DOMAIN:?Set KODERA_MATRIX_DOMAIN to the tenant base domain}"
    restart: unless-stopped
    networks:
      default:
      edge:

  room-access:
    mem_limit: 256m
    build:
      context: ../../apps/server
      dockerfile: Dockerfile
    command: ["python", "-m", "room_access"]
    restart: unless-stopped
    environment:
      ROOM_ACCESS_SYNAPSE_URL: http://synapse:8008
      ROOM_ACCESS_MATRIX_TOKEN: ${ROOM_ACCESS_MATRIX_TOKEN:?Set ROOM_ACCESS_MATRIX_TOKEN in .env}
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_WS_URL: wss://${KODERA_DOMAIN:-chat.example.org}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
      ROOM_ACCESS_ALLOWED_ORIGINS: https://${KODERA_DOMAIN:-chat.example.org}
      ROOM_ACCESS_AGENT_USER: "@kodera-agent:${KODERA_DOMAIN:-chat.example.org}"
      ROOM_ACCESS_API_BIND: "0.0.0.0"
      ROOM_ACCESS_API_PORT: "8095"
      ROOM_ACCESS_WEBHOOK_BIND: "0.0.0.0"
    depends_on:
      server:
        condition: service_healthy
      synapse:
        condition: service_healthy
    networks:
      default:
      edge:

  synapse-db:
    mem_limit: 512m
    image: postgres:17.12-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD: ${SYNAPSE_POSTGRES_PASSWORD:?Set SYNAPSE_POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - synapse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 10

  synapse:
    mem_limit: 1g
    image: matrixdotorg/synapse:v1.165.0@sha256:673b4223c81a7634fd07d832b939a58f97081cfdaae7cdd2d1664cdcf7611b62
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        rm -rf /tmp/kodera-policy-src /tmp/kodera-policy
        cp -R /opt/kodera-policy /tmp/kodera-policy-src
        python -m pip install --no-index --no-deps --no-build-isolation --target /tmp/kodera-policy /tmp/kodera-policy-src
        if [ ! -f /data/homeserver.yaml ]; then
          /start.py generate
        fi
        python /opt/community/configure_synapse.py /data/homeserver.yaml
        exec /start.py
    environment:
      SYNAPSE_SERVER_NAME: ${KODERA_DOMAIN:-chat.example.org}
      SYNAPSE_REPORT_STATS: "no"
      PYTHONPATH: /tmp/kodera-policy
      PGPASSWORD: ${SYNAPSE_POSTGRES_PASSWORD:?Set SYNAPSE_POSTGRES_PASSWORD in .env}
      KODERA_FEDERATION_MODE: ${KODERA_FEDERATION_MODE:-}
      KODERA_MATRIX_FEDERATION_ALLOWLIST: ${KODERA_MATRIX_FEDERATION_ALLOWLIST:-}
      KODERA_DEFAULT_COMMUNITY_ORG_SLUG: ${KODERA_DEFAULT_COMMUNITY_ORG_SLUG:-}
      KODERA_DEFAULT_COMMUNITY_ISSUER: ${KODERA_DEFAULT_COMMUNITY_ISSUER:-}
      KODERA_SYNAPSE_OIDC_ISSUER: ${KODERA_SYNAPSE_OIDC_ISSUER:-}
      KODERA_SYNAPSE_OIDC_CLIENT_SECRET: ${KODERA_SYNAPSE_OIDC_CLIENT_SECRET:-}
      # The operator's choice, and the Compose files that actually run: Synapse refuses a mismatch.
      KODERA_TOPOLOGY: ${KODERA_TOPOLOGY:-single}
      KODERA_COMPOSE_TOPOLOGY: single
    volumes:
      - synapse_data:/data
      - ../../packages/synapse-policy:/opt/kodera-policy:ro
      - ./configure_synapse.py:/opt/community/configure_synapse.py:ro
    depends_on:
      synapse-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      default:
      edge:

  livekit:
    mem_limit: 512m
    image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}"
    ports:
      - "7881:7881"
      - "50000-50200:50000-50200/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      default:
      edge:

volumes:
  media_socket:
  media_secrets:
  proximity_socket:
  agent_state:
  caddy_data:
  caddy_config:
  postgres_data:
  valkey_data:
  synapse_data:
  synapse_postgres_data:

networks:
  default:
  edge:
    driver: bridge
  api_ingress:
    driver: bridge
    ipam:
      config:
        - subnet: ${KODERA_API_INGRESS_SUBNET:-172.30.240.0/28}
