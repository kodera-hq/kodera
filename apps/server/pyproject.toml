# Local Core runtime and its shared development toolchain.

[project]
name = "kodera-server"
version = "0.0.0"
description = "Control plane of kodera.io: system of record and provisioning worker."
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "gunicorn==27.0.0",
  "argon2-cffi==25.1.0",
  "Django==6.1.2",
  "djangorestframework==3.18.3",
  "psycopg[binary]==3.3.8",
  "django-environ==0.14.0",
  "PyJWT[crypto]==2.15.1",
  "cryptography==50.0.2",
  "uuid6==2025.0.1",
]

[project.optional-dependencies]
billing-documents = [
    "factur-x==7.9",
    "reportlab==5.1.0",
    "saxonche==13.1.1",
]

[tool.uv]
# The runtime is an application, not a published wheel.
package = false

# uv dependency groups: `uv sync` installs `dev` by default.
# Runtime and development resolution is recorded in uv.lock.
[dependency-groups]
dev = [
  # Read by scripts/ci/check-authz-matrix.py: the contract is YAML, and
  # a hand-rolled scanner over a 4 000-line OpenAPI file is a parser nobody
  # reviewed. Declared here rather than relied on as a transitive dependency.
  "PyYAML==6.0.3",
  # Validates the workspace operations' responses against the contract's schemas
  # (tests/test_workspace_onboarding.py, WS-14). Already locked through schemathesis;
  # declared because a test imports it.
  "jsonschema-rs==0.61.1",
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-django>=4.9",
  "pytest-cov>=5.0",
  "pytest-randomly>=3.15",
  "time-machine>=2.15",
  "respx>=0.21",
  "schemathesis>=3.36",
  "django-stubs[compatible-mypy]>=5.1",
  "djangorestframework-stubs>=3.15",
  "pre-commit>=3.8",
]

# ---------------------------------------------------------------- ruff -------

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ", "N"]
ignore = [
  # Formatter owns line breaking; E501 would fight it on long strings only.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and fixtures carry deliberately fake credentials.
"tests/**" = ["S101", "S105", "S106"]
"**/conftest.py" = ["S101"]
# Django settings modules are wildcard-import and constant-heavy by design.
"**/settings/*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["core", "jobs", "services"]
combine-as-imports = true

[tool.ruff.lint.flake8-bugbear]
# DRF and Django decorators legitimately call in the default argument position.
extend-immutable-calls = ["fastapi.Depends", "django.utils.translation.gettext_lazy"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- mypy -------

[tool.mypy]
python_version = "3.12"
# Baseline for the whole repo: honest but not blocking on third-party gaps.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
# pytest requires each test directory's hooks in a file named conftest.py, and mypy refuses two
# top-level modules of one name. tests/first_slice/conftest.py is checked; the job-queue one is not.
exclude = ['^tests/job_queue/conftest\.py$']

[tool.django-stubs]
# Typechecking imports the same local/test configuration as acceptance.
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
# --strict lives where the money and the infrastructure mutations live.
module = ["services.*", "jobs.*", "worker.*", "apps.jobs.*", "apps.outbox.*", "apps.audit.*", "apps.billing.*", "core.db.*", "core.idempotency.*", "core.api.idempotency"]
disallow_untyped_defs = true
# Present so this override really is `--strict`, which docs/dev/BASELINE.md
# promises. Without it a class inheriting from an untyped third-party base
# silently becomes Any, and every method on it stops being checked — the one
# hole through which unchecked code reaches the strict packages.
disallow_subclassing_any = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_return_any = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# -------------------------------------------------------------- pytest -------

[tool.pytest.ini_options]
# Use real PostgreSQL; never silently substitute SQLite.
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "--strict-markers",
  "--strict-config",
  # Each acceptance run owns and drops its synthetic test database.
  # pytest-randomly: order dependence is a bug, so surface it every run.
  "-p", "randomly",
]
markers = [
  "slow: takes more than a second; excluded from the fast local loop",
  "integration: needs Postgres, Keycloak or another service from compose.yaml",
  "first_slice_scenario(id): one mandatory first-slice acceptance scenario; its state is tests/first_slice/scenarios.toml",
  "job_queue_acceptance(id): one job-queue (A3) acceptance test; its state is tests/job_queue/acceptance.toml",
]
filterwarnings = ["error"]

# ------------------------------------------------------------ coverage -------

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "manage.py",
  "*/settings/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Raised deliberately once services/ and jobs/ exist; a threshold nobody can
# meet gets lowered instead of met.
fail_under = 0
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
