# The disposable PostgreSQL the FS-BOOT acceptance drives, and nothing else.
#
# Its own compose project, `fsboot-acceptance`, separate from the development stack in
# `compose.yaml`: `docker compose down -v` removes every named volume of the project it is
# given, so a harness that reset the development project would take another worktree's
# database with it. This project owns one container and no named volume — the data directory
# is a tmpfs — so tearing it down can destroy nothing that outlives the run.
#
# Port 55432, not 5432, for the same reason: the development stack, and other stacks on the
# same machine, hold the default.

name: fsboot-acceptance

services:
  db:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    environment:
      POSTGRES_DB: kodera_server
      POSTGRES_USER: kodera
      POSTGRES_PASSWORD: kodera
      # Deterministic collation, as in compose.yaml: an index built under a different one
      # behaves differently, and that difference shows up as a flaky ordering test.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    tmpfs:
      - /var/lib/postgresql/data:rw,size=512m
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kodera -d kodera_server"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
