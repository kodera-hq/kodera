# Reference billing catalogue fixture (`apps/billing/catalogue/offer.toml`).
#
# Amounts are synthetic reference values in euro cents, excluding VAT, used by
# the open-source control-plane test suite and local evaluation stack. Monthly
# prices represent list amounts; yearly prices represent a 10 % annual billing
# discount paid yearly in advance. Enterprise is offered on an annual term.
#
# The historical `workspace` pack keeps its original applications and profile.
# The additive `workspace-v2` edition includes messaging, calls and documents,
# priced by capacity tier with new plan versions. Legacy `visio` and `visio-docs` packs remain
# stored with `available = false` so historical order snapshots keep resolving.
#
# Loaded via `manage.py load_catalogue apps/billing/catalogue/offer.toml`.
# Loading never mutates snapshotted order prices: price updates add new rows
# with their own `valid_from`, and plan changes create new plan versions
# (`docs/domain/BILLING_MODEL.md`).

[[packs]]
code = "workspace"
name = "Kodera"
description = "Canaux de discussion, salons audio et réunions vidéo pour toute votre organisation, sur votre instance, hébergée dans l’Union européenne."
apps = ["visio", "messaging"]
profile_ref = "workspace/1.0"
available = false

[[packs]]
code = "visio"
name = "Visio"
description = "Réunions vidéo et salles de réunion permanentes sur votre instance, hébergée dans l’Union européenne."
apps = ["visio"]
profile_ref = "visio/1.0"
available = false

[[packs]]
code = "visio-docs"
name = "Visio + Docs"
description = "Réunions vidéo, salles de réunion permanentes et documents collaboratifs sur votre instance, hébergée dans l’Union européenne."
apps = ["visio", "docs"]
profile_ref = "visio-docs/1.0"
available = false

[[capacity_tiers]]
code = "S"
name = "Capacité S"
seats_included = 80
concurrent_participants_included = 25
storage_included_bytes = 50000000000
vm_shape = "vm-s"

