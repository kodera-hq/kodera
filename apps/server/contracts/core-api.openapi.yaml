        label: { type: [string, 'null'], maxLength: 100 }
        locale: { type: string, enum: [fr, en], description: 'Language of the runbook returned with the draft.' }
      examples:
        - { provider: microsoft, allowed_email_domains: [acme.fr], label: Microsoft ACME, locale: fr }

    FederationProviderPatchRequest:
      type: object
      title: FederationProviderPatchRequest
      description: |
        `login_mode` is deliberately absent: switching an organisation to redirect-only is the
        activation action, because it needs the hosted-account count in front of the person doing
        it and a successful test behind it.
      additionalProperties: false
      properties:
        allowed_email_domains:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, maxLength: 253 }
        label: { type: [string, 'null'], maxLength: 100 }
      examples:
        - { allowed_email_domains: [acme.fr, acme.com] }

    FederationCredentialsPatchRequest:
      type: object
      title: FederationCredentialsPatchRequest
      description: |
        Write-only. Nothing in this API ever returns `client_secret`, and it never appears in a log
        line, an audit event, an analytics event or an error message. A rejected save clears the
        field in the console rather than re-rendering the value.
      additionalProperties: false
      properties:
        client_id: { type: string, minLength: 1, maxLength: 200 }
        client_secret:
          type: string
          minLength: 8
          maxLength: 500
          writeOnly: true
          description: Envelope-encrypted on arrival. Never returned, never logged, never echoed in a problem document.
        secret_expires_on:
          type: [string, 'null']
          format: date
          description: What the provider says. Used only to warn the customer before it lapses.
      examples:
        - { client_id: 4f2a6c8e-0b2d-4f6a-8c0e-2b4d6f8a0c2e, client_secret: '<redacted>', secret_expires_on: '2027-06-30' }

    FederationCredentialStatus:
      type: object
      title: FederationCredentialStatus
      description: The whole answer to "did the secret save". Never the secret.
      required: [federation_provider_id, client_id, secret_set, state]
      additionalProperties: false
      properties:
        federation_provider_id: { type: string, format: uuid }
        client_id: { type: string, maxLength: 200 }
        secret_set: { type: boolean, const: true }
        secret_expires_on: { type: [string, 'null'], format: date }
        state: { $ref: '#/components/schemas/FederationProviderState' }
        updated_at: { type: string, format: date-time }
      examples:
        - federation_provider_id: 9b0c1d2e-3f40-4152-8a63-7b8c9d0e1f20
          client_id: 4f2a6c8e-0b2d-4f6a-8c0e-2b4d6f8a0c2e
