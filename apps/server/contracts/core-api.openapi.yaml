    FederationTestCreateRequest:
      type: object
      title: FederationTestCreateRequest
      required: [return_url]
      additionalProperties: false
      properties:
        return_url:
          type: string
          format: uri
          description: Where the browser comes back to. Must be an `app.kodera.io` URL; anything else is refused.
      examples:
        - { return_url: 'https://app.kodera.io/acme-sa/federation/test' }

    FederationTest:
      type: object
      title: FederationTest
      description: |
        A real sign-in, run against the provider, that creates no account and changes nobody else's
        sign-in. It is what turns "the secret is saved" into "it works", and activation can be
        refused until one has succeeded.

        The tested address comes back masked so a result can be read out in a room; the provider's
        raw message stays server-side and the console gets a closed `failure_code` and a translated
        `provider_message_key`.
      required: [id, federation_provider_id, state, created_at]
      properties:
        id: { type: string, format: uuid }
        federation_provider_id: { type: string, format: uuid }
        state: { type: string, enum: [pending, completed, expired] }
        authorization_url:
          type: [string, 'null']
          format: uri
          description: Where the console sends the browser. Single use, valid 10 minutes, null once the test has completed.
        result: { type: [string, 'null'], enum: [success, failed, null] }
        subject_email_masked: { type: [string, 'null'], maxLength: 320, examples: ['m****e@acme.fr'] }
        display_name: { type: [string, 'null'], maxLength: 200 }
        domain_allowed: { type: [boolean, 'null'], description: 'Whether the signed-in address is in `allowed_email_domains`.' }
        failure_code:
          oneOf:
            - { $ref: '#/components/schemas/FederationFailureCode' }
            - { type: 'null' }
        provider_message_key: { type: [string, 'null'], maxLength: 100, description: 'Translated key. Never the provider''s own string.' }
        started_by: { type: string, format: uuid }
        completed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
      examples:
        - id: a1b2c3d4-5e6f-4708-8a19-2b3c4d5e6f70
          federation_provider_id: 9b0c1d2e-3f40-4152-8a63-7b8c9d0e1f20
          state: completed
          authorization_url: null
          result: failed
          subject_email_masked: m****e@acme.fr
          display_name: Marc Dubois
          domain_allowed: true
          failure_code: redirect_uri_mismatch
          provider_message_key: federation.error.redirect_uri_mismatch
          started_by: 11111111-2222-4333-8444-555555555555
          completed_at: '2026-12-03T11:02:00Z'
          created_at: '2026-12-03T11:01:12Z'

    FederationActivateRequest:
      type: object
      title: FederationActivateRequest
      description: |
        `acknowledged_hosted_accounts` must equal the count the console showed the person. A stale
        number means the screen they confirmed is not the world they are confirming, and the call is
        refused with `conflict` rather than redirecting more people than they agreed to.
      required: [login_mode, acknowledged_hosted_accounts]
      additionalProperties: false
      properties:
        login_mode: { $ref: '#/components/schemas/FederationLoginMode' }
        acknowledged_hosted_accounts: { type: integer, minimum: 0 }
      examples:
        - { login_mode: both, acknowledged_hosted_accounts: 14 }

    FederationRunbook:
      type: object
      title: FederationRunbook
      description: |
        The procedure to follow in the provider's own admin console, as an ordered list of message
        keys. No step is free prose, so it is translated once and stays correct when a generated
        value changes; `value_ref` names which member of `FederationValues` a step refers to, and
        the console renders that value inline and copyable.
      required: [federation_provider_id, provider, steps]
      properties:
        federation_provider_id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/FederationProviderKind' }
        locale: { type: string, enum: [fr, en] }
        steps:
          type: array
          items:
            type: object
            required: [index, body_key]
            properties:
              index: { type: integer, minimum: 1 }
              body_key: { type: string, maxLength: 100 }
              value_ref:
                type: [string, 'null']
                enum: [application_name, redirect_uri, logout_uri, scopes, account_types_label_key, issuer_url, entity_id, acs_url, null]
              caution_key: { type: [string, 'null'], maxLength: 100 }
        estimated_duration_s: { type: [integer, 'null'], minimum: 0 }
        download:
          description: Short-lived link to the PDF of the same procedure. Null while it is being rendered.
          oneOf:
            - { $ref: '#/components/schemas/DownloadLink' }
            - { type: 'null' }
      examples:
        - federation_provider_id: 9b0c1d2e-3f40-4152-8a63-7b8c9d0e1f20
          provider: microsoft
          locale: fr
          steps:
            - { index: 1, body_key: federation.microsoft.runbook.open_entra, value_ref: null, caution_key: null }
            - { index: 2, body_key: federation.microsoft.runbook.new_registration, value_ref: application_name, caution_key: null }
            - { index: 3, body_key: federation.microsoft.runbook.paste_redirect, value_ref: redirect_uri, caution_key: federation.microsoft.runbook.caution_trailing_slash }
          estimated_duration_s: 900
          download: null

