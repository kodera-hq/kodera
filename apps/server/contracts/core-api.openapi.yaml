            value: todo
        updatedAt: '2026-11-13T12:00:00Z'
    WorkspaceCollectionRowRequest:
      type: object
      title: WorkspaceCollectionRowRequest
      additionalProperties: false
      required:
      - values
      properties:
        values:
          type: object
          maxProperties: 100
          additionalProperties:
            $ref: '#/components/schemas/CollectionValue'
      description: Replace typed properties of this collection/document pair. Both must belong to this workspace
        and the caller must currently edit the document. Unknown, cross-workspace or invisible documents return
        404.
    CollectionQuery:
      type: object
      title: CollectionQuery
      additionalProperties: false
      required: []
      properties:
        viewId:
          type: string
          minLength: 1
          maxLength: 64
        filters:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CollectionFilter'
        sorts:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/CollectionSort'
      description: Bounded conjunction of filters. Stable final sort key is document ID. Opaque signed cursor
        binds collection, query fingerprint, current membership and ordering; changed query or tampering is
        400. Visibility is rechecked per row and page.
    WorkspaceQuotaCounters:
      type: object
      title: WorkspaceQuotaCounters
      additionalProperties: false
      required:
      - seats
      - mediaBytes
      - pages
      properties:
        seats:
          type: integer
          minimum: 0
        mediaBytes:
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0
      examples:
      - seats: 4
        mediaBytes: 1024
        pages: 12
    WorkspaceQuotaLimits:
      type: object
      title: WorkspaceQuotaLimits
      additionalProperties: false
      required:
      - seats
      - mediaBytes
      - pages
      properties:
        seats:
          type:
          - integer
          - 'null'
          minimum: 0
        mediaBytes:
          type:
          - integer
          - 'null'
          minimum: 0
        pages:
          type:
          - integer
          - 'null'
          minimum: 0
      examples:
      - seats: 10
        mediaBytes: 1073741824
        pages: 100
      description: Null means explicitly unlimited in the server-owned offer snapshot. Missing configuration
        never becomes unlimited. Counts are active seats plus outstanding reserved invitations, committed
        media plus upload reservations, and active pages.
    WorkspaceQuotaUsage:
      type: object
      title: WorkspaceQuotaUsage
      additionalProperties: false
      required:
      - usage
      - limits
      - measuredAt
      properties:
        usage:
          $ref: '#/components/schemas/WorkspaceQuotaCounters'
        limits:
          $ref: '#/components/schemas/WorkspaceQuotaLimits'
        measuredAt:
          type: string
          format: date-time
      examples:
      - usage:
          seats: 4
          mediaBytes: 1024
          pages: 12
        limits:
          seats: 10
          mediaBytes: 1073741824
          pages: 100
        measuredAt: '2026-11-13T12:00:00Z'
      description: Observation only. Writes reserve quota under the same workspace lock as the mutation; never
        trust this response or client counters as authorization. Seat/page exhaustion is 402, media bytes
        413, request throttling 429 with Retry-After. Configuration/enforcement failure is 503, never a successful
        uncharged write.
    BillingArtifact:
      type: object
      title: BillingArtifact
      additionalProperties: false
      required:
      - content_type
      - filename
      - sha256
      - size_bytes
      properties:
        content_type:
          type: string
          enum:
          - application/pdf
          - application/xml
        filename:
          type: string
          minLength: 1
          maxLength: 255
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        size_bytes:
          type: integer
          minimum: 1
      description: Digest and size identify bytes built solely from an immutable Core billing snapshot; no
        mutable catalogue, organisation profile or provider invoice contributes to these bytes.
    BillingArtifacts:
      type: object
      title: BillingArtifacts
      additionalProperties: false
      required: []
      properties:
        pdf:
          $ref: '#/components/schemas/BillingArtifact'
        xml:
          $ref: '#/components/schemas/BillingArtifact'
      description: PDF/A-3 embeds factur-x.xml; standalone XML is Factur-X EN 16931. Presence means generated
        and verified, never an unsupported conformance claim. Type code is 380 for invoices and 381 for credit
        notes.
    BillingVatStatus:
      type: object
      title: BillingVatStatus
      additionalProperties: false
      required:
      - vat_number
      - country_code
      - status
      - checked_at
      - next_check_at
      - evidence_id
      properties:
        vat_number:
          type:
          - string
          - 'null'
          maxLength: 32
        country_code:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{2}$
        status:
          type: string
          enum:
          - not_checked
          - valid
          - invalid
          - unavailable
        checked_at:
          type:
          - string
          - 'null'
          format: date-time
        next_check_at:
          type:
          - string
          - 'null'
          format: date-time
        evidence_id:
          type:
          - string
          - 'null'
          format: uuid
      examples:
      - vat_number: null
        country_code: null
        status: not_checked
        checked_at: null
        next_check_at: null
        evidence_id: null
      description: Persisted VIES consultation, not a live assertion or a tax exemption by itself. Unavailable
        never means valid. Snapshot VAT treatment is frozen on invoice issuance; later consultations cannot
        rewrite an issued invoice. No raw upstream response or customer address is disclosed.
    BillingVatValidationRequest:
      type: object
      title: BillingVatValidationRequest
      additionalProperties: false
      required:
      - vat_number
      - country_code
      properties:
        vat_number:
          type: string
          minLength: 1
          maxLength: 32
        country_code:
          type: string
          pattern: ^[A-Z]{2}$
      description: Normalize and validate the country-specific number before bounded VIES consultation. Persist
        valid, invalid and unavailable outcomes with evidence and retry time; never silently grant reverse-charge
        treatment on a timeout.
    PrivacyExportRequest:
      type: object
      title: PrivacyExportRequest
      additionalProperties: false
      required:
      - format
      properties:
        format:
          type: string
          const: zip
        includeMedia:
          type: boolean
          default: true
      description: Export only currently authorized data. Account scope exports the person's own data and
        never every workspace record. Signed archive manifest binds requester, scope, snapshot, entries, checksums
        and expiry. Worker resumes from persisted bounded checkpoints; retries do not duplicate entries.
    PrivacyDeletionRequest:
      type: object
      title: PrivacyDeletionRequest
      additionalProperties: false
      required:
      - confirmation
      properties:
        confirmation:
          type: string
          const: delete
        reason:
          type: string
          maxLength: 500
      description: Explicit irreversible intent; require recent verified reauthentication server-side. Revoke
        sessions, tickets and uploads before purge. Retain only statutory accounting snapshots and minimal
        lawful proof until purgeAfter. Legal hold is an explicit blocked lifecycle, never successful deletion.
    PrivacyWorkspaceExport:
      type: object
      title: PrivacyWorkspaceExport
      additionalProperties: false
      required:
      - id
      - scope
      - kind
      - status
      - requestedAt
      - updatedAt
      - expiresAt
      - purgeAfter
      - failureCode
      properties:
        id:
          type: string
          format: uuid
        scope:
          type: string
          const: workspace
        kind:
          type: string
          const: export
        status:
          type: string
          enum:
          - queued
          - running
          - ready
          - failed
          - expired
          - cancelled
        requestedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        purgeAfter:
          type:
          - string
          - 'null'
          format: date-time
        failureCode:
          type:
          - string
          - 'null'
          enum:
          - build_failed
          - storage_unavailable
          - identity_conflict
          - legal_hold
          - null
      examples:
      - id: 00000000-0000-7000-8000-000000000001
        scope: workspace
        kind: export
        status: queued
        requestedAt: '2026-11-13T12:00:00Z'
        updatedAt: '2026-11-13T12:00:00Z'
        expiresAt: null
        purgeAfter: null
        failureCode: null
      description: 'Durable restart-safe lifecycle. Export: queued -> running -> ready -> expired (or failed).
        Deletion: queued -> running -> retention_pending -> completed (or failed); completed never precedes
        durable purge proof. Account scope binds the authenticated person, never a body subject ID. Workspace
        scope requires its current owner. Last-owner account deletion requires a prior ownership transfer.
        Accounting records remain access-restricted until their statutory ten-year purgeAfter, with legal
        holds reported explicitly. No active content is retained merely because accounting must be retained.'
