  /federation-providers/{federation_provider_id}/credentials:
    parameters:
      - $ref: '#/components/parameters/FederationProviderId'
    patch:
      operationId: setFederationCredentials
      summary: Set the client id and the client secret
      description: |
        Write-only. The secret is envelope-encrypted on arrival and **no endpoint of this API ever
        returns it**, not to staff, not to the owner, not in an error message and not in a log. The
        response says whether a secret is set and when it expires, and nothing more.

        `PATCH` rather than `PUT` because this contract does not use `PUT`; sending both members
        replaces both. Sending `client_secret: null` is refused: clearing a secret is disabling the
        provider, which is `DELETE`.
      tags: [Federation]
      x-kodera-scope: 'federation_provider:update'
      x-kodera-authz:
        roles: [org_owner, org_admin, staff_operator]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/FederationCredentialsPatchRequest' }
      responses:
        '200':
          description: Whether a secret is now set, and its expiry. Never the secret.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FederationCredentialStatus' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /federation-providers/{federation_provider_id}/tests:
    parameters:
      - $ref: '#/components/parameters/FederationProviderId'
    get:
      operationId: listFederationTests
      summary: The tests run against this provider
      description: The history, newest first, so a customer can see that it worked yesterday and not today.
      tags: [Federation]
      x-kodera-scope: 'federation_test:read'
      x-kodera-authz:
        roles: [org_owner, org_admin, org_member, staff_operator, staff_support]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of tests.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/FederationTest' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: startFederationTest
      summary: Start a real sign-in test
      description: |
        Returns an authorisation URL the console sends the browser to. The person signs in at
        Google or Microsoft for real, comes back, and the result says whether the provider accepted
        them and whether their email domain is one this provider is allowed to serve.

        A test never creates an account and never changes how anyone else signs in. It is the step
        that turns "I pasted the secret" into "it works", and it is why activation can be refused
        until a test has succeeded.
      tags: [Federation]
      x-kodera-scope: 'federation_test:create'
      x-kodera-authz:
        roles: [org_owner, org_admin, staff_operator]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FederationTestCreateRequest' }
      responses:
        '201':
          description: The test, with the URL to send the browser to.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
            Location:
              description: Canonical URL of the created test.
              schema: { type: string, format: uri-reference }
              example: /api/v1/federation-tests/a1b2c3d4-5e6f-4708-8a19-2b3c4d5e6f70
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FederationTest' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
