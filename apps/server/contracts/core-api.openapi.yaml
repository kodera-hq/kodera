        '503':
          description: Required source, private storage, signing, authority or lifecycle proof is unavailable.
            No incomplete export or unproved deletion is reported successful.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

