openapi: 3.1.0
info:
  title: Kodera Core API
  version: 0.44.2
  summary: Control plane of kodera.io, consumed by kodera-web and by staff operators.
  description: |
    The Core API is the only backend of `kodera-web` (console ADR-0003) and the system of
    record for organisations, memberships, catalog, orders, subscriptions, invoices, tenants,
    domains, jobs and audit.

    ## Conventions

    - Base path `/api/v1`. Every breaking change ships as `/api/v2`; additive changes stay in v1.
    - Every `POST` but `previewInvitation` requires an `Idempotency-Key` header. Except `discoverRealm`, whose
      dedicated parameter specifies compatibility-only semantics for a non-mutating lookup,
      the key is stored with the request fingerprint; same key/body replays the first
      response and changed body returns `idempotency-key-reuse`. `discoverRealm` stores
      no key, body fingerprint or response and evaluates every request independently
      under its quotas. `previewInvitation` is a read sent as a `POST` so that its token
      travels in a body rather than a URL: it takes no `Idempotency-Key`, ignores one sent
      anyway, and stores nothing.
    - Every response carries `X-Request-Id`. It is the correlation id in logs and audit
      events, and is echoed in the `request_id` member of every problem document.
    - Errors are RFC 9457 problem documents (`application/problem+json`). The registry of
      `type` URIs is `components.schemas.ProblemType`.
    - Collections are cursor paginated (`cursor`, `limit`); offsets are never exposed.
    - Money is `{amount_minor, currency}` with `amount_minor` in the smallest unit of the
      currency. Never a float, never a string.
    - Timestamps are RFC 3339 with an explicit offset, always `Z` on the wire, except
      caller_assurance.enrollment_window.evaluated_at_ms and valid_before_ms: these two
      version1 coordinates are nonnegative integer milliseconds at most 9007199254740991
      on the declared Core time axis, not a qualified browser deadline or renewed TTL.
    - Core-owned resource identifiers are server-generated UUIDv7 values, rendered in canonical
      lower-case UUID form and treated as opaque by clients (core ADR-0009).
    - The API process holds no infrastructure credential (core ADR-0003). Anything that
      touches Scaleway, Keycloak, DNS or a tenant VM is a `Job` executed by the worker,
      committed in the same transaction as the desired-state change (core ADR-0004).

    ## Authorisation

    Every operation carries an `x-kodera-authz` extension naming the roles allowed. Roles are:

    | Role | Realm | Meaning |
    |---|---|---|
    | `anonymous` | none | no token required |
    | `bootstrap` | organisation realm | the intended first owner of a `prospect` organisation, authenticated in its realm and holding no membership yet; reaches the bootstrap status and the owner claim, nothing else |
    | `org_owner` | organisation realm | signed the order, sole holder of billing and deletion rights |
    | `org_admin` | organisation realm | manages people, roles, domains, support |
    | `org_billing` | organisation realm | reads invoices and manages billing, no people or tenant-operation rights |
    | `org_member` | organisation realm | reads its own identity and the tenant status |
    | `staff_operator` | `kodera-staff` realm | triggers jobs, enrols agents, reads every tenant |
    | `staff_support` | `kodera-staff` realm | reads tenants and tickets, triggers no job |
    | `staff_security` | `kodera-staff` realm | reads audit events, jobs and instance logs; no mutation and no secret values |

    The names are the ones `docs/api/AUTHZ.md` §4 uses, character for character, and the
    `OrganisationRole` schema uses the same four for the tenant side. One role, one spelling.

    Every operation also carries `x-kodera-scope: <resource>:<verb>`, the row and verb of the
    `AUTHZ.md` §5 matrix that governs it. The two extensions answer two questions — *what is being
    touched* and *who may touch it* — and a missing declaration fails the contract test rather than
    defaulting open (`AUTHZ.md` §5).

    The organisation is derived from the token issuer (`iss` → realm → organisation). A realm
    claim supplied by the client is never trusted (console ADR-0002).

    ## Espace: from the channel tree to Matrix rooms

    Core holds the workspace's tree (`getWorkspace`: categories, then channels, each with its
    `kind` and `room_state`) and never a message, a Matrix room id or an occupancy. Everything
    live is read from the organisation's own homeserver, which the tenant agent converges to this
    tree (ADR-0018, `docs/specs/ESPACE_STRUCTURE.md` §12). The mapping is normative for every
    client (the console and the native apps):

    | Core | Matrix |
    |---|---|
    | the `slug` of the organisation's newest tenant that is not `deleted` (`Tenant.slug`, from `listTenants` or `getTenant`) | the homeserver's `server_name`, `{slug}.{matrix domain}`: `kodera.io` in production, `staging.kodera.io` on staging. It may differ from the organisation's `slug`, and a client never derives the server name from the organisation's (ADR-0023). Permanent: a tenant's slug never changes. The client discovers the homeserver at `https://{server_name}/.well-known/matrix/client` |
    | a member (the realm's `sub`) | `@{sub, lower-cased}:{server_name}` |
    | a channel's `id` | the room alias `#kodera-ch-{id}:{server_name}` (lower-case UUID with dashes), resolved with `GET /_matrix/client/v3/directory/room/{alias}`; a rename or a move keeps it. A client never matches a room by name |
    | a channel's `kind` and access | the state event `io.kodera.room.policy` (state key `""`): `{"version": 1, "kind": "text" \| "audio", "listen_only": bool, "may_publish": [user ids], "archived": bool}`, written by the agent only |
    | an audio room's occupancy | the state event `io.kodera.room.occupancy` (state key `""`): `{"version": 1, "participants": [{"user_id", "devices" (≥ 1), "screen_share", "camera"}], "at_ms"}`, written by the room-access service only, on change |
    | `room_state: pending` or `failed` | no usable room yet: the client shows the channel as not usable |
    | categories and positions | Core only; Matrix holds no tree (no spaces) |

    Members are joined to rooms by the agent and have no invite to accept. A member removed from
    a channel is kicked, and Synapse forgets the room for them within milliseconds
    (`forget_rooms_on_leave`): the room leaves their `/sync` and its history answers 403. A member
    who leaves the organisation has their Matrix account deactivated, which ends every token at
    once. A client purges what it holds of a room on leave, and of every room on a refused
    refresh. An audio room's media token comes from `POST https://{homeserver}/_kodera/rooms/token`
    with the member's own Matrix token; that service is not part of this contract.
  contact:
    name: kodera-server maintainers
    url: https://github.com/kodera-hq/kodera
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  x-kodera-contract: core-api
  x-kodera-owners:
    - kodera-hq/core

servers:
  - url: https://api.kodera.io/api/v1
    description: Production, Scaleway fr-par.
  - url: https://api.staging.kodera.io/api/v1
    description: Staging, its own Keycloak, its own data. The only target open to coding agents.
  - url: http://localhost:8000/api/v1
    description: Local docker compose stack.

tags:
  - name: Identity
    description: Who the caller is, and the organisations they belong to.
  - name: Organisations
    description: The commercial and legal entity that buys a tenant.
  - name: Memberships
    description: People in an organisation, their roles, their invitations, on-site enrolment.
  - name: Workspace
    description: The organisation's workspace structure, its categories and channels; never their content.
  - name: Catalog
    description: Plans, packs, capacity tiers and prices. Read-only for customers.
  - name: Orders
    description: Order intake, the entry point of the tenant lifecycle.
  - name: Billing
    description: Subscriptions, invoices and payment links.
  - name: DPA
    description: Data processing agreement generated per tenant, accepted before processing.
  - name: Tenants
    description: A provisioned suite, its provisioning steps, its apps and its capacity.
  - name: Domains
    description: Custom domains and their verification state machine.
  - name: Federation
    description: Guided Google or Microsoft sign-in, brokered by the organisation's realm.
  - name: Support
    description: Tickets with tenant context, and the status components behind the banner.
  - name: Jobs
    description: Every infrastructure mutation. Staff triggers them, customers read them.
  - name: Audit
    description: Append-only record of who did what. Staff only.
  - name: Agents
    description: Enrolment of the agent that runs on every tenant VM, and its logs. Staff only.

security:
  - keycloakTenant: []
  - keycloakStaff: []

paths:
  /me:
    get:
      operationId: getMe
      summary: The caller, their identities and their organisations
      description: |
        Returns the authenticated person, the Keycloak identities that resolve to them, and every
        organisation they are a member of with the role held in each. A person may hold identities
        in several organisations' realms; the console uses this to render an
        organisation switcher after login.

        The local customer-read increment resolves an enabled stored identity by exact issuer and
        subject, then requires its current active membership in an active or suspended organisation.
        Stored roles and contact fields determine the response; token role or email claims do not.
        Verified staff authentication returns 403 until the separate staff implementation exists.
        The wider role matrix and PATCH remain Proposed; this increment does not implement them.

        Every response is Cache-Control: no-store. A strong ETag hashes the complete serialized
        projection only, excluding hidden update timestamps (CONVENTIONS.md section 10).
        Current authorization and the coherent projection are resolved before If-None-Match,
        including weak tags, lists and wildcard matching; revoked access never returns 304.
      tags: [Identity]
      x-kodera-scope: 'identity:read'
      x-kodera-authz:
        roles: [org_owner, org_admin, org_billing, org_member, staff_operator, staff_support, staff_security]
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: Evaluated only after current authorization; matching returns an empty 304.
          schema: { type: string }
      responses:
        '200':
          description: The caller.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '304':
          description: Current authorized projection matches; no response body.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: patchMe
      summary: Change your own language or display name
      description: |
        The console's language switch. Locale is held here rather than in the browser so a person
        who signs in from a second machine, and every notification mail they receive, follow the
        same choice.
      tags: [Identity]
      x-kodera-scope: 'identity:update'
      x-kodera-authz:
        roles: [org_owner, org_admin, org_billing, org_member, staff_operator, staff_support, staff_security]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/MePatchRequest' }
      responses:
        '200':
          description: The caller, updated.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/discover:
    post:
      operationId: discoverRealm
      summary: Resolve an organisation slug or email domain to a current eligible realm
      tags:
      - Identity
      security: []
      x-kodera-scope: organisation:read
      x-kodera-authz:
        roles:
        - anonymous
      parameters:
      - $ref: '#/components/parameters/DiscoveryCompatibilityKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealmDiscoveryRequest'
      responses:
        '200':
          description: Fresh current zero/one/multiple result. No replay header.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: No HTTP response caching.
              example: no-store
            RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
            RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
            RateLimit-Reset:
              schema:
                type: integer
                minimum: 0
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealmDiscoveryResult'
        '400':
          description: Malformed JSON, duplicate JSON keys, missing or invalid compatibility header.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: No HTTP response caching.
              example: no-store
            RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
            RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
            RateLimit-Reset:
              schema:
                type: integer
                minimum: 0
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: A browser request refused from its headers, before any quota charge or body read; forbidden. Its Origin is not an exact allowed Console origin, or its Sec-Fetch-Site is cross-site.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: No HTTP response caching.
              example: no-store
            RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
            RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
            RateLimit-Reset:
              schema:
                type: integer
                minimum: 0
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Body exceeds 4096 bytes; payload-too-large with limit_bytes 4096.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: No HTTP response caching.
              example: no-store
            RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
            RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
            RateLimit-Reset:
              schema:
                type: integer
                minimum: 0
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Content type is not application/json.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: No HTTP response caching.
              example: no-store
            RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
            RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
            RateLimit-Reset:
              schema:
                type: integer
                minimum: 0
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Schema/approved ASCII format validation error with safe pointers/codes.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: No HTTP response caching.
              example: no-store
            RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
            RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
            RateLimit-Reset:
              schema:
                type: integer
                minimum: 0
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Any evaluated shared quota exhausted; rate-limited and actual remaining wait, minimum one second.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: No HTTP response caching.
              example: no-store
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Equals body retry_after_s.
            RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
            RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
            RateLimit-Reset:
              schema:
                type: integer
                minimum: 0
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected failure; correlated, no internal or input details.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: No HTTP response caching.
              example: no-store
            RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
            RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
            RateLimit-Reset:
              schema:
                type: integer
                minimum: 0
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Discovery dependency, HMAC, counter capacity or database unavailable; route-local service-unavailable;
            five-second backoff is not a recovery promise.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: No HTTP response caching.
              example: no-store
            Retry-After:
              schema:
                type: integer
                minimum: 1
                const: 5
              description: Equals body retry_after_s.
            RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
            RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
            RateLimit-Reset:
              schema:
                type: integer
                minimum: 0
              description: Tightest evaluated quota; reset is seconds. Omit if route prerequisite failed before quota
                evaluation; never fabricate counters.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      description: |-
        Anonymous non-mutating lookup. Ignore Authorization entirely: it neither authenticates nor selects results on this operation. Require Idempotency-Key, validate the dedicated compatibility syntax, then discard it. Identical, changed-body and concurrent same-key requests independently charge quotas and select current data. Store no key, key digest, body fingerprint, response or in-flight state; use no key lock, replay header or idempotency 409. Generic POST replay remains unchanged for every other operation.

        Enforce the 4096-byte limit on received body bytes before JSON parsing (413 payload-too-large). Require application/json (415 unsupported-media-type). Malformed JSON and duplicate object keys are 400 malformed-request. Missing compatibility key is 400 idempotency-key-missing; invalid key is 400 malformed-request. Exactly one known string slug or email is required; shape/format errors are 422 validation-error. Use canonical ASCII slugs of 5–20 characters without URL parsing or case repair. Email uses the bounded ASCII schema; lowercase only its exact domain and discard the local part before lookup, quota-key creation or logging.

        Read one coherent current database snapshot of nondeleted active/suspended organisations with worker-confirmed ready customer realms. Exclude prospects, staff realms, closed, deleted and unready organisations. Email selection requires current verified organisation/domain associations, never member email, tenant web domains or suffix matching; while no verified association exists, every email lookup returns the zero result. Perform no provider/DNS call, identity/account mutation or owner bootstrap. Unknown/ineligible input returns the exact five-field zero result. A single match uses top-level metadata and empty candidates; multiple matches use 2–20 candidates and null top-level metadata. Candidates are distinct by organisation and ordered by slug then id. Realm equals organisation slug and realm; issuer is exactly the configured identity provider's realm issuer {identity provider}/realms/{slug}, the organisation issuer derived from the deployment's staff issuer (the examples show https://id.kodera.io), with its derived /.well-known/openid-configuration URL. Cross-field agreement and current-authority conditions require runtime assertions beyond JSON Schema. Positive metadata intentionally reveals organisation existence; the neutral negative shape does not prevent enumeration.

        Refuse from headers alone, before any quota charge or body read: a media type other than application/json (415), a missing or invalid compatibility key (400), and a browser request whose Origin is not an exact allowed Console origin or whose Sec-Fetch-Site is cross-site (403 forbidden). A request carrying neither Origin nor Sec-Fetch-Site, a native client's, is never refused for its origin. No cross-site page can spend another client's quota.

        Shared database-backed rolling 60-second quotas are 30/IP, 60/slug per IP, 300/email-domain per IP and 600/global. A value bucket is per client, so no stranger can exhaust a tenant's lookups. Charge global/IP before parsing and valid-value buckets before lookup. Trust only the direct connection peer, or, when that peer is a configured trusted edge, the rightmost untrusted X-Forwarded-For hop (docs/specs/TRUSTED_EDGE.md); with no trusted edge configured, ignore forwarded-IP headers. Normalize IPv4-mapped addresses and count one IPv6 /64 as one client. Quota exhaustion is 429 with the actual controlling-stage delay rounded up, minimum one second, equal in Retry-After and retry_after_s. Enforcement/configuration/database failure is route-local 503 with five-second minimum backoff, not a recovery promise. Missing/invalid dedicated 32-byte HMAC configuration fails before quota state or lookup without raw/unkeyed fallback. Use two-second database budgets for limiter and selection; uncertain quota commit cannot yield successful uncharged lookup. Rate events expire after 60 seconds and healthy cleanup removes them within 120 seconds after expiry. The 10000 retained-event cap fails closed without evicting live counts.

        Every response carries X-Request-Id and Cache-Control: no-store. Problems echo current request correlation without input or internal details. RateLimit-Limit/Remaining/Reset describe the tightest evaluated bucket only; omit them when prerequisites fail before evaluation, never fabricate counters. Return no Idempotency-Replayed header.
  /organisations:
    get:
      operationId: listOrganisations
      summary: List organisations
      description: Staff view over every organisation. A customer token sees only its own and should call `/me`.
      tags: [Organisations]
      x-kodera-scope: 'organisation:read'
      x-kodera-authz:
        roles: [staff_operator, staff_support, staff_security]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: query
          in: query
          description: Case-insensitive match on name, slug or billing email.
          required: false
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: A page of organisations.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Organisation' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createOrganisation
      summary: Record a staff intake and create the organisation it is for
      description: |
        Staff-assisted intake, the server's `record_intake` management command
        `plans/complete-mock/FIRST_SLICE_SPEC.md` §P1. In one Postgres transaction the API
        validates and reserves the organisation slug, creates the organisation in `prospect`,
        records the intake — the recorded customer instruction reference and the intended owner
        contact, against the staff actor — enqueues the `realm_create` job that is the identity
        bootstrap operation (`docs/domain/JOB_CATALOGUE.md` §2, organisation-scoped), and writes
        the `organisation.intake_recorded` audit event. The API process touches no identity
        provider here (core ADR-0003); the worker creates the realm and binds the intended
        identity, and `getOrganisationBootstrap` reports its progress.

        **It creates no membership for anyone.** The caller does not become `org_owner`, and no
        staff principal ever holds a customer membership. First ownership is established only by
        `consumeOwnerClaim`: the intended verified person proves their identity in the
        organisation's realm and presents the claim the worker issued for that organisation and
        that identity, which creates the first `org_owner` membership and moves the organisation
        to `active` in one transaction. `org_owner` is not granted here because a principal holds
        that role only inside an existing organisation: the grant could never be exercised
        (`docs/api/AUTHZ.md` §4).

        `instruction_ref` is a reference — a ticket or signed-request identifier — never the
        instruction's content. The intended owner contact is sealed — encrypted at application
        level under a key of Core's — on the intake record, and only its masked form is ever
        returned; there is no `Contact` row for it. The optional profile members (`legal_name`,
        `country`, `vat_number`, `siren`, `billing_email`, `billing_address`, `email_domains`,
        `locale`) are validated as declared and sealed with it, as received: `Organisation` does
        not store them yet, so the `201` body's `organisation` does not carry them. Staff
        assistance never substitutes for the customer's own acceptance of terms or processing
        instructions. A body naming a membership, a role, a DPA or an order is refused
        `422 validation-error` by `additionalProperties: false`; the guarded operations for those
        stay with the customer.

        The slug is reserved by the database's unique constraints, never by a read before the
        write: a slug an organisation already holds is `409 slug-taken`, and of two concurrent
        intakes for one slug exactly one succeeds. A reserved name — one of the closed list on
        `OrganisationCreateRequest.slug`, among them `kodera-staff`, the staff realm, and `master`,
        the identity provider's administration realm — is `422 validation-error` with the code
        `reserved`.

        The caller is a staff principal with a second factor in `amr` (`403 mfa-required`
        otherwise) and a current `staff_operator` grant; both refusals are audited
        `authz.denied`. A database that does not admit the intake yet — before its identity and
        mail cutover is declared final (`docs/specs/FIRST_OWNER_BOOTSTRAP.md` §3.8) — answers
        `503 intake-closed`. That refusal, like the authentication and authorisation ones, comes
        before the key is read and is not stored, so the same key is valid once the intake opens.

        `Idempotency-Key` is the intention key of the intake: a resumed or repeated submission of
        the same intake returns the same organisation and the same bootstrap, never a second slug
        reservation or a second job (`docs/api/CONVENTIONS.md` §8). A committed `201`, its
        successful replays and an `idempotency-key-in-flight` response carry the same opaque
        `X-Operation-Ref`: correlation only, never proof that a durable row exists, a resource URL
        or an authorization capability. No lookup by that value exists.
      tags: [Organisations]
      x-kodera-scope: 'organisation:create'
      x-kodera-authz:
        roles: [staff_operator]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganisationCreateRequest' }
      responses:
        '201':
          description: The organisation in `prospect`, and the bootstrap the intake started.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
            X-Operation-Ref:
              description: Opaque correlation reference for this committed intake operation.
              required: true
              schema: { $ref: '#/components/schemas/OperationReference' }
              example: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
            Location:
              description: Canonical URL of the created organisation.
              schema: { type: string, format: uri-reference }
              example: /api/v1/organisations/6f1d2e3c-8a4b-4c5d-9e6f-0a1b2c3d4e5f
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganisationIntakeResult' }
        '400': { $ref: '#/components/responses/MalformedRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `slug-taken`: an organisation already holds the slug, or a concurrent intake reserved
            it first. Also `idempotency-key-reuse` and `idempotency-key-in-flight`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
            X-Operation-Ref:
              description: |
                Present if and only if the Problem `type` is `idempotency-key-in-flight`; absent
                for `slug-taken` and `idempotency-key-reuse`.
              required: false
              schema: { $ref: '#/components/schemas/OperationReference' }
              example: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                slugTaken:
                  value:
                    type: https://kodera.io/problems/slug-taken
                    title: Slug already held
                    status: 409
                    request_id: 019467a3-0f9b-7cc3-98c2-1fa48f28f562
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503':
          description: |
            `intake-closed`: this database does not admit the intake yet
            (`docs/specs/FIRST_OWNER_BOOTSTRAP.md` §3.8). Not stored against the key.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                intakeClosed:
                  value:
                    type: https://kodera.io/problems/intake-closed
                    title: Intake not admitted
                    status: 503
                    request_id: 019467a3-0f9b-7cc3-98c2-1fa48f28f562

