    WorkspaceCollectionRequest:
      type: object
      title: WorkspaceCollectionRequest
      additionalProperties: false
      required:
      - title
      - properties
      - views
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        properties:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CollectionProperty'
        views:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CollectionView'
      description: Editors only. Enforce unique property/view IDs and cross-references transactionally. No
        client-supplied organisation, row ID, ACL or quota counter is accepted.
    WorkspaceCollectionPatch:
      type: object
      title: WorkspaceCollectionPatch
      additionalProperties: false
      required: []
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        properties:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CollectionProperty'
        views:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CollectionView'
      description: At least one field is required. Reject removal or incompatible change of populated properties
        with 409; validate every saved view against the resulting schema.
      minProperties: 1
    WorkspaceCollectionRow:
