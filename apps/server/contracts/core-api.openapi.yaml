    DomainState:
      type: string
      title: DomainState
      description: |
        The domain verification state machine. A host is never added to a certificate list before
        the TXT nonce has been observed (strategy 3.2, step 4).

        ```
        pending ──▶ nonce_issued ──▶ txt_verified ──▶ dns_pending ──▶ certificate_issued ──▶ live
             └──────────────┴───────────────┴──────────────┴────────────────┴──────────▶ failed
        ```

        | State | Meaning | Next |
        |---|---|---|
        | `pending` | the row exists, nothing issued yet | `nonce_issued` |
        | `nonce_issued` | the customer must publish `_kodera-verify.<host>` TXT | `txt_verified` |
        | `txt_verified` | the nonce was observed from several resolvers | `dns_pending` |
        | `dns_pending` | waiting for the `CNAME` or `A` target to resolve to ours | `certificate_issued` |
        | `certificate_issued` | the certificate exists; for a media host it is being copied into LiveKit | `live` |
        | `live` | serving | terminal until deletion |
        | `failed` | a check failed; `verification.failure_code` says which | any earlier state on the next pass |
      enum: [pending, nonce_issued, txt_verified, dns_pending, certificate_issued, live, failed]
      examples: [dns_pending]

    DomainCreateRequest:
      type: object
      title: DomainCreateRequest
      required: [fqdn, role]
      additionalProperties: false
      properties:
        fqdn: { type: string, maxLength: 253, examples: ['visio.acme.fr'] }
        role:
          type: string
          enum: [web, media]
          description: |
            `web` points at the retained web IP, `media` at the dedicated media IP that carries
            TURN over TLS on 443. A pack with calls needs one of each.
        app: { $ref: '#/components/schemas/AppCode' }
      examples:
        - { fqdn: visio.acme.fr, role: web, app: visio }

    Domain:
      type: object
      title: Domain
      description: |
        A custom domain and everything the console's domain wizard needs to tell the customer what
        to publish and what is missing.
      required: [id, tenant_id, fqdn, kind, role, state, verification, target, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        fqdn: { type: string, maxLength: 253 }
        kind:
          type: string
          enum: [subdomain, apex]
          description: A subdomain gets a `CNAME`, an apex gets an `A` on the retained IP.
        role: { type: string, enum: [web, media] }
        app:
          oneOf:
            - { $ref: '#/components/schemas/AppCode' }
            - { type: 'null' }
        state: { $ref: '#/components/schemas/DomainState' }
        is_canonical:
          type: boolean
          default: false
          description: |
            The host used in invitation links and as the application's base URL. One per tenant and
            per role; moved with `PATCH /domains/{domain_id}`, and only to a domain in state `live`.
        verification:
          type: object
          description: |
            The TXT nonce challenge. The nonce is single use and rotates on every re-issue.

            `record_value` is `kodera-verify=` followed by 48 lower-case Crockford base-32
            characters (`0123456789abcdefghjkmnpqrstvwxyz`), from 30 random bytes — the normative
            definition is `docs/domain/DOMAIN_STATE_MACHINE.md` §2. That shape is **not** pinned as
            a `pattern` here, deliberately: see `CONSOLE_RECONCILIATION.md` §6.1. The example is
            deliberately non-random so no scanner mistakes it for a live nonce.
          required: [record_name, record_type, record_value]
          properties:
            record_name: { type: string, maxLength: 253, examples: ['_kodera-verify.visio.acme.fr'] }
            record_type: { type: string, enum: [TXT] }
            record_value: { type: string, maxLength: 255 }
            issued_at: { type: [string, 'null'], format: date-time }
            verified_at: { type: [string, 'null'], format: date-time }
            checked_at: { type: [string, 'null'], format: date-time }
            attempts: { type: integer, minimum: 0 }
            failure_code:
              description: Why the last check failed. Closed set, so every value maps to one copy key.
              oneOf:
                - { $ref: '#/components/schemas/DomainFailureCode' }
                - { type: 'null' }
            resolvers_agreeing: { type: [integer, 'null'], minimum: 0, description: 'How many independent resolvers returned the nonce.' }
        target:
          type: object
          description: What the customer must publish once the nonce is verified.
          required: [record_name, record_type, record_value]
          properties:
            record_name: { type: string, maxLength: 253 }
            record_type: { type: string, enum: [CNAME, A] }
            record_value: { type: string, maxLength: 255 }
            observed_value: { type: [string, 'null'], maxLength: 255 }
        certificate:
          description: Null until issuance. `days_left` drives the expiry alert and the agent vitals.
          oneOf:
            - type: object
              properties:
                state: { type: string, enum: [pending, issuing, issued, failed] }
                issued_at: { type: [string, 'null'], format: date-time }
                expires_at: { type: [string, 'null'], format: date-time }
                days_left: { type: [integer, 'null'] }
                issuer: { type: [string, 'null'], maxLength: 100 }
                failure_code:
                  oneOf:
                    - { $ref: '#/components/schemas/DomainFailureCode' }
                    - { type: 'null' }
            - { type: 'null' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      examples:
        - id: b3c4d5e6-f708-491a-8b2c-3d4e5f6a7b8c
          tenant_id: 2c9f0e7a-1b3d-4e5f-8a9b-0c1d2e3f4a5b
          fqdn: visio.acme.fr
          kind: subdomain
          role: web
          app: visio
          state: dns_pending
          is_canonical: false
          verification:
            record_name: _kodera-verify.visio.acme.fr
            record_type: TXT
            record_value: kodera-verify=00000000000000000000000000000000000000000000fake
