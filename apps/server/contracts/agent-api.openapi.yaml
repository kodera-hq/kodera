    ConfigBundle:
      type: object
      title: ConfigBundle
      description: |
        Configuration and secrets for one command on one instance. Every value is a secret: render
        it, write it mode 600, and keep nothing. Not logged, not echoed in a result, not cached.
      required: [config_ref, tenant, instance_id, generated_at, expires_at, files]
      properties:
        config_ref: { type: string, maxLength: 200 }
        tenant: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,30}[a-z0-9](?![\s\S])' }
        instance_id: { type: string, format: uuid }
        command_id: { type: [string, 'null'], format: uuid }
        generated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        profile:
          oneOf:
            - { $ref: '#/components/schemas/ProfileRef' }
            - { type: 'null' }
        files:
          type: array
          description: |
            What to write, where, and with what mode. `content` is the rendered value; the agent
            does not template it further.
          items:
            type: object
            required: [path, mode, content_b64]
            properties:
              path: { type: string, maxLength: 500, description: 'Absolute path on the VM.' }
              mode: { type: string, pattern: '^0[0-7]{3}$', description: 'Octal mode. Secrets are 0600.' }
              owner: { type: string, maxLength: 64 }
              group: { type: string, maxLength: 64 }
              content_b64: { type: string, contentEncoding: base64, description: 'The file content. A secret.' }
              sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        reload:
          type: array
          description: Services to reload or restart once the files are written, in order.
          items:
            type: object
            required: [service, action]
            properties:
              service: { type: string, maxLength: 100 }
              action: { type: string, enum: [reload, restart, none] }
      examples:
