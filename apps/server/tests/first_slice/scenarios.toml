# First-slice acceptance inventory: every mandatory scenario and its honest state.
#
# This file is authoritative for scenario state. The identifiers are transcribed from
# first-slice acceptance matrix, read at internal commit
# d5f4e6e2f346be66298d8ebfe257594a8e431919. CI never reads that prose; it compares this file with
# the tests that are actually collected and with `dev/first_slice_manifest.json`.
#
# state = "pass"     the scenario passes against this tree; no gap, no reason.
# state = "xfail"    what the scenario asserts is specified, the path is not built. Strict: a pass
#                    turns CI red, and so does a red for any gap other than the one recorded here.
# state = "blocked"  what the scenario asserts depends on an open decision named in `gap`. Strict in
#                    the same way; the body checks the decision before anything else.
#
# `gap` is the first thing the scenario reaches that does not exist: operation:<operationId>,
# record:<model>, service:<name>, worker:<name>, adapter:<name>, harness:<name>, contract:<name> or
# decision:<key>. The conftest binds it at run time, so a scenario red at any other point fails CI.
# Most gaps are measured and turn into a failure the moment what they measure appears; a few
# seams are asserted because Core declares nothing to measure yet. The harness module docstring
# says which are which.

format = 1
transcribed_from = "first-slice acceptance matrix at d5f4e6e2f346be66298d8ebfe257594a8e431919"
required_count = 33

# ------------------------------------------------------------------------------ decisions ----
# The first seven are the rows of FIRST_SLICE_SPEC.md "Completion and open decisions". The last is
# recorded in this repository's design of record and is not a row of that table; it is decided, and
# no scenario is red on it: contract 0.10.0 makes placeOrder org_owner only. The organisation
# slug rule is decided (5-20 for organisations and the owner-claim bootstrap, the minimum the
# owner's answer set, register SLUG-MIN-ANSWER; 3-32 for tenants) and is no longer listed: FS-ID-01
# and FS-ID-02 measure the contract against it first, and the contract carries it from 0.11.0.

