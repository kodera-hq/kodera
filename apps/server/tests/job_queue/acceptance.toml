# Job-queue acceptance inventory: every A3 acceptance test and its honest state.
#
# Authoritative for state; docs/specs/JOB_QUEUE.md §9 describes what each asserts.
#
# state = "xfail"  specified, not built. Strict: in every phase the only accepted report is the call
#                  raising exactly QueueGapError with `gap`; anything else fails the run by name.
# state = "pass"   passes against this tree; no gap.
#
# `gap` is the first thing the test reaches that does not exist, measured by
# queue_harness.RealBinding: app:<installed app>, module:<module> or service:<module>.<function>.
#
# `permissive` and `inert` are the exact AssertionError message, the first line of the failure,
# that each counterexample queue of counterexamples.py must fail the test with. The self-test runs
# the test against both. When a test's assertions change, these move with them.

format = 1

[[test]]
id = "A3-01"
function = "test_a3_01_a_process_killed_before_the_audit_row_commits_nothing"
state = "pass"
permissive = "killed at the desired-state change, the job row was committed"
inert = "an enqueue returned without waiting at the table the test had locked"

