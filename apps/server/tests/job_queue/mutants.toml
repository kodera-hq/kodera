# Single-guard mutants of a conforming queue, and the acceptance test and exact assertion message
# that must catch each: docs/specs/JOB_QUEUE.md §9.1 point 3 and §9.2.
#
# A row disables ONE guard or ONE clause of a guard, and nothing else: a lock condition's fence and
# its lease are two rows, a CHECK over six columns is six, a time order of three comparisons is three,
# a trigger that holds in two states is two, a mapping of three pairs is three, a re-check made by
# eight writers is eight, a parent check made by nine writes is nine, a rule the two writers of a
# dispatch each hold is two, a statement two functions each commit first is two. A row that disabled
# two would hide that a test probes only one of them.
#
# Every row that acts at more than one site, or for more than one writer or caller, is listed below
# with its reason, and so is every row known to cover several clauses of one check. Two of the lists
# are derived from the code by the self-test, and say so. The others are kept by hand, from reading
# each flag's site and the callers of the function that reads it. Where a row leaves a site, a
# caller or a clause unprobed, the specification's §9.3 names it as owed and says why.
#
# Ten rows disable one guard at multiple sites that read it, because either early site is masked by
# the other in every deterministic test, and a row nothing can catch proves nothing:
#   sweep_unexpired   the sweep's "the lease expired", in its read of candidates and in its re-check
#                     under the row lock (the re-check alone: specification §9.3, not covered)
#   lease_uses_now    the clock of a runner write's lease predicate, in its first statement and in its
#                     re-check under the lock, for all eight writers at once: probed through
#                     record_dispatch; the four effect writers also use it after their parent check
#                     (specification §9.3)
#   renew_ignores_lease, step_ignores_lease, dispatch_ignores_lease, retarget_ignores_lease,
#   subjob_start_ignores_lease, close_ignores_lease, hold_ignores_lease, finish_ignores_lease
#                     one writer's "the lease is live", in its first statement and in its re-check
#                     under the lock, and for the four effect writers after the parent check too.
#                     The child-row re-check alone is <writer>_no_recheck_after_lock's row;
#                     the parent-wait re-check is <writer>_no_recheck_after_parent's row
# Four rows disable one read of a claim at both of its checks, 1 and 4, because their owning test
# reads that the claim is refused, which check 4 alone still does and check 1 alone still does:
#   no_reservation_check  the read of the reservations. Check 4's alone is
#                     check4_skips_reservations' row; check 1's alone has no row (specification §9.3)
#   no_delivery_check, delivery_in_flight_only, delivery_check_ignores_changes_realm
#                     the read of the deliveries, or one clause of it. Neither check's read alone has
#                     a row: check 4's is not covered by a deterministic test, check 1's is owed
#                     (specification §9.3)
# Two rows move one statement, and so read their flag at two places, where the statement leaves and
# where it goes. This list is derived from the code by the self-test: a flag read at more than one
# place and not listed here fails it.
#   audit_second_txn  the job.created audit row, out of enqueue's transaction and into one of its own
#   steps_after_audit the insert of the steps, from before the audit row to after it
# Three rows disable a function's clause and the database guard that would refuse what the mutant then
# writes, because with the guard armed the mutant raises instead of failing an assertion, and a row
# nothing can catch proves nothing. The first two's database clauses also keep their own marker and
# their own row, which a test session's direct write owns; no_dedupe's unique key has no row of its
# own, because enqueue's ON CONFLICT (idempotency_key) needs it: dropping the key alone makes every
# enqueue raise, which no assertion can catch. This list is derived from the code by the self-test:
#   orphan_loses_place                 the sweep's update keeping the place, and jobs_job_guard's
#                                      place_may_be_cleared
#   decision_rewrites_closed_dispatch  the decision's "closed_at IS NULL", and jobs_jobdispatch_guard's
#                                      three write-once clauses (closed_at, outcome, evidence)
#   no_dedupe                          the ON CONFLICT of the one insert enqueue_job and start_sub_job
#                                      share, and the UNIQUE constraint jobs_job_idempotency_key_unique.
#                                      Probed through enqueue_job: start_sub_job derives its key from
#                                      the dispatch it records in the same call, so no test can make
#                                      it meet a key that exists
# Five rows disable several clauses of one check and are probed on one, or by one probe that needs
# them all. None is split in A3; each clause left unprobed is owed (specification §9.3):
#   structured_evidence_unchecked      the job decision's presence check keeps each piece's provider
#                                      and drops its resource_id and request_id, four fields: probed
#                                      on target_read.resource_id
#   delivery_decision_ignores_compute, delivery_decision_ignores_target
#                                      the delivery decision's presence check of one piece, three
#                                      fields: probed on compute_terminated.request_id and on
#                                      target_read.resource_id
#   no_clock_tolerance, delivery_no_clock_tolerance
#                                      the 5-minute tolerance of two comparisons, the start and the
#                                      decision: one probe needs both
# A mutant deletes a line where its guard is one: a predicate, a clause, a statement. Where the guard
# is a choice between two forms there is no line to delete, and the mutant takes the other form. Three
# groups of such rows are listed here. test_job_queue_selftest.py checks each count against its list,
# and the two groups a name identifies against the rows.
# Four rows replace a path, because that is the only form their guard has:
#   subjob_full_checks          the guard IS the branch "a sub-job runs none of the checks": the
#                               mutant keeps the parent check and falls through to the ordinary path
#   delivery_exit_compares_xmin a substitution by design: the rule measured by the row's xmin. The
#                               trigger writes its same-transaction rule once per measure for it, so
#                               this marker and delivery_exit_any_transaction's each stand in both
#                               arms, of which one is live
#   delivery_decide_no_effect_maps_succeeded, delivery_decide_fail_maps_pending
#                               the guard IS the mapping of an exit to the delivery's new status:
#                               each mutant maps one exit to another status
# Fourteen rows replace a lock mode, every row named <site>_locks_for_update: the guard IS the mode
# FOR NO KEY UPDATE (JQ-P25; JQ-P14 for the delivery decision), and each mutant takes FOR UPDATE at
# one site:
#   claim_locks_for_update, promotion_locks_for_update, renew_locks_for_update,
#   step_locks_for_update, dispatch_locks_for_update, retarget_locks_for_update,
#   subjob_start_locks_for_update, close_locks_for_update, hold_locks_for_update,
#   finish_locks_for_update, sweep_locks_for_update, stranding_locks_for_update,
#   decide_locks_for_update, delivery_decide_locks_for_update
# Eight rows swap two checks, every row named <first>_checked_before_<second>: the guard IS the
# order in which a decision refuses, and each mutant runs one pair of checks in the other order:
#   role_checked_before_status, role_checked_before_subjobs, evidence_checked_before_role,
#   order_checked_before_presence, partial_checked_before_order,
#   delivery_evidence_checked_before_role, delivery_order_checked_before_presence,
#   delivery_partial_checked_before_order
# Other rows also put something in the place of what they disable: another status, another operator,
# or two statements in the other order. exhausted_closes_completed, budget_off_by_one,
# budget_before_dispatch and decided_at_before_lock are four of them. They are neither listed nor
# counted here: no name sets them apart from a deletion, so no test could check a list of them. Each
# row's `mutant` field says what its mutant does.
# Four rows are clauses of the one promotion statement, which claim_job and sweep_expired_leases each
# commit first: promotion_ignores_not_before, promotion_instant_per_row, promotion_waits and
# promotion_locks_for_update. The statement is one site. That each function commits it is a row per
# function: claim_skips_promotion and no_promotion.
# Seven rows are read in the one step 5 that a claim of a top-level job and a claim of a sub-job
# share, and are probed through top-level jobs: started_every_claim, resume_claim_counts_attempt, and
# the claim's class C completion's claim_ignores_closed_class_c, claim_completes_any_class,
# claim_completes_across_cycles, claim_cycle_from_first_resume and claim_completion_unaudited.
#
# Checked now by test_job_queue_selftest.py, textually and structurally: every property of the
# specification's §9.3 names its owning tests and has a row; every owning test a property names is
# used by a row of it; every row's test is an owning test of its property; its message is the
# literal message of an `assert` that is a statement its test always runs — not after a `return`, a
# `raise` or a skip, and not where an `AssertionError` is swallowed — testing something other than
# constants or a fixture, in no other test, and named by no other row. That shows a row is
# well-formed, never that its mutant is caught. The change that implements A3 builds every row as a
# committed flag on apps.jobs and runs it in CI (§9.2): that is the gate.
#
# [property.JQ-Pnn] tests   the acceptance tests that own the property
# property  a JQ-Pnn identifier of the specification's §9.3
# flag      the one guard, or the one clause of a guard, the mutant disables
# test      the acceptance test that must catch the mutant
# message   the exact assertion message it must fail with
# mutant    what the mutant does, for the implementer who builds it

format = 1

