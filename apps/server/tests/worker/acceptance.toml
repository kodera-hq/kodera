# Worker boundary acceptance (G1.5): every WK test and its honest state.
#
# Authoritative for state. tests/worker/worker_acceptance.py binds each row to the one test function
# that names it, and tests/worker/test_worker_acceptance_selftest.py refuses any disagreement.
#
# state = "pass"   passes against this tree; no gap.
# state = "xfail"  specified, not built. Strict: the only accepted outcome is the gap probe raising
#                  exactly `gap`, still missing when measured again; a pass or any other failure
#                  fails the run by name.
#
# `gap` is the first thing the test reaches that does not exist, measured by the probe:
#   worker:runner                   the job runner, `worker.runner`, module or package
#   worker:synthetic-provider-proof the synthetic provider's authenticated terminal proof (W3)
# Both exist since G1.5-B, so no row records either; the probe still fails the day one goes.
#
# WK-07 proves what compose declares, statically. A live proof that a forbidden peer cannot be
# reached is out of scope: production isolation is Fleet's network policy, the SRE's evidence (W2).
# WK-01 and WK-02 hold an accident guard, not a sandbox.
#
# WK-11 to WK-13 start a real worker against the test database pytest-django creates.
#
# Not here, because it needs Docker: the built worker image starting, holding its files, and
# reaching its database and nothing else on the internal network. dev/accept_worker_image.py proves
# those in CI's `images` job.

format = 1

[[test]]
id = "WK-01"
function = "test_wk_01_the_booted_worker_refuses_to_bind_a_socket"
state = "pass"

