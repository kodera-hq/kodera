org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
# AGP 9 creates host unit tests for the tested build type (debug) only. The
# release source set has its own tests (app/src/testRelease), so `test` runs both.
android.onlyEnableUnitTestForTheTestedBuildType=false
# Keep deterministic lowercase resource paths in release APKs instead of aapt2
# mixed-case base-62 path shortening (`res/ce.xml` vs `res/Ce.xml`), which fails
# check-native-packaging.py's case-collision archive safety invariant.
android.enableResourceOptimizations=false
