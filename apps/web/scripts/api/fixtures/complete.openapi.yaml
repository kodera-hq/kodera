# A minimal contract with the shapes the generator has to get right: a cursor-paginated
# collection whose envelope example is empty, a POST that requires an idempotency key, and
# a 202 whose `Location` example sits on the header object itself (`example:`), not on its
# schema — the shape every `Location` header in the real contract uses.
# Used by generate.selftest.sh. Not the real contract — that one is pinned in contracts/.
openapi: 3.1.0
info:
  title: Generator fixture
  version: 1.0.0
paths:
  /widgets/{widget_id}/rebuild:
    post:
      operationId: rebuildWidget
      parameters:
        - $ref: '#/components/parameters/WidgetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Rebuild started.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Location:
              description: Canonical URL of the job.
              schema: { type: string }
              example: /jobs/job-1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
  /widgets:
    get:
      operationId: listWidgets
      responses:
        '200':
          description: A page of widgets.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Widget' }
    post:
      operationId: createWidget
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WidgetCreateRequest' }
      responses:
        '201':
          description: Created.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Widget' }
components:
  headers:
    XRequestId:
      description: Correlation id.
      required: true
      schema:
        type: string
        examples: ['01JB8Z1M2X4C6R8T0V2Y4A6C8E']
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    WidgetId:
      name: widget_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    JobAccepted:
      type: object
      required: [job_id]
      properties:
        job_id: { type: string }
      examples:
        - job_id: 'job-1'
    CursorPage:
      type: object
      required: [data, has_more]
      properties:
        data:
          type: array
          items: {}
        next_cursor:
          type: [string, 'null']
        has_more:
          type: boolean
      examples:
        - data: []
          next_cursor: null
          has_more: false
    Widget:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
      examples:
        - id: 'w-1'
          name: 'A widget'
    WidgetCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
      examples:
        - name: 'A widget'
    ProblemType:
      type: string
      format: uri
      description: |
        | `type` | Status | When | What the client should do |
        |---|---|---|---|
        | `validation-failed` | 400 | body or parameters malformed | show the field errors |
        | `idempotency-key-missing` | 400 | a `POST` without `Idempotency-Key` | a client bug |
      enum:
        - https://kodera.io/problems/validation-failed
        - https://kodera.io/problems/idempotency-key-missing
      examples:
        - https://kodera.io/problems/validation-failed
