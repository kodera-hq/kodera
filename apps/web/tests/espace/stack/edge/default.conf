# The tenant edge, as Fleet's synapse profile routes it (profiles/synapse/1.0/README.md): the
# room-access token call on the homeserver's own origin, everything else to Synapse. Only with
# the `audio` profile (docs/dev/ESPACE_STACK.md).
server {
  listen 8080;
  client_max_body_size 50m;

  location = /_kodera/rooms/token {
    proxy_pass http://room-access:8095/token;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://synapse:8008;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
