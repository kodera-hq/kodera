name: Feature or Extension Proposal
description: Propose an enhancement, SDK capability, or community integration.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What workflow or pain point does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How should this work for users or developers?
    validations:
      required: true
