name: Release Binaries

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-release:
    name: Desktop Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos
            artifact_name: release-desktop-macos
          - os: ubuntu-latest
            target: linux
            artifact_name: release-desktop-linux
          - os: windows-latest
            target: windows
            artifact_name: release-desktop-windows
    steps:
      - name: Enforce LF git checkout on Windows runner
        if: matrix.target == 'windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release workflow policy gate and bundler selftests
        if: matrix.target == 'linux'
        run: |
          python3 scripts/ci/check-release-workflow.py --selftest
          python3 scripts/ci/check-release-workflow.py
          python3 scripts/ci/package-android-release.py --selftest
          python3 scripts/ci/assemble-release-sbom.py --selftest
          node scripts/ci/package-desktop-release.mjs --selftest

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install Linux desktop WebKitGTK, AppIndicator and packaging libraries
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            dpkg-dev \
            squashfs-tools

      - name: Install SHA256-verified AppImage Type-2 ELF runtime
        if: matrix.target == 'linux'
        env:
          APPIMAGE_RUNTIME_TAG: "20251108"
          APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/appimage-runtime-x86_64" \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_TAG}/runtime-x86_64"
          echo "${APPIMAGE_RUNTIME_SHA256}  $RUNNER_TEMP/appimage-runtime-x86_64" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/appimage-runtime-x86_64"
          echo "KODERA_APPIMAGE_RUNTIME_PATH=$RUNNER_TEMP/appimage-runtime-x86_64" >> "$GITHUB_ENV"

      - name: Install SHA256-verified NSIS packager on Windows
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          NSIS_VERSION: "3.13"
          NSIS_ZIP_SHA256: ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8
        run: |
          $ErrorActionPreference = 'Stop'
          $nsisZip = Join-Path $env:RUNNER_TEMP "nsis-$($env:NSIS_VERSION).zip"
          $nsisDest = Join-Path $env:RUNNER_TEMP 'nsis'
          Invoke-WebRequest -Uri "https://github.com/tauri-apps/binary-releases/releases/download/nsis-$($env:NSIS_VERSION)/nsis-$($env:NSIS_VERSION).zip" -OutFile $nsisZip
          $actualHash = (Get-FileHash -Path $nsisZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:NSIS_ZIP_SHA256.ToLowerInvariant()) {
            throw "NSIS archive SHA-256 mismatch: expected $($env:NSIS_ZIP_SHA256), got $actualHash"
          }
          Expand-Archive -Path $nsisZip -DestinationPath $nsisDest -Force
          Remove-Item -Path $nsisZip -Force
          $nsisDir = Join-Path $nsisDest "nsis-$($env:NSIS_VERSION)"
          $makensisExe = Join-Path $nsisDir 'makensis.exe'
          if (-not (Test-Path -LiteralPath $makensisExe -PathType Leaf)) {
            throw "makensis.exe missing after extraction: $makensisExe"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          Add-Content -Path $env:GITHUB_ENV -Value "KODERA_NSIS_MAKENSIS_PATH=$makensisExe"

      - name: Install locked npm workspace dependencies
        run: npm ci --ignore-scripts

      - name: Install stable Rust toolchain
        shell: bash
        env:
          DESKTOP_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "$DESKTOP_TARGET" = "macos" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: Build @kodera/web and package @kodera/desktop installers
        shell: bash
        env:
          DESKTOP_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          npm --workspace @kodera/web run build
          node scripts/ci/package-desktop-release.mjs --target "$DESKTOP_TARGET" --out-dir dist-release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

  android-release:
    outputs:
      package_sha256: ${{ steps.candidate-digest.outputs.sha256 }}
    name: Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build paired release APKs and export resolved runtime Maven artifacts
        working-directory: apps/android
        env:
          KODERA_ANDROID_CORE_ORIGIN: ${{ vars.KODERA_ANDROID_CORE_ORIGIN || 'https://api.kodera.io' }}
          KODERA_ANDROID_ISSUER_ORIGINS: ${{ vars.KODERA_ANDROID_ISSUER_ORIGINS || 'https://auth.kodera.io' }}
          KODERA_ANDROID_CLIENT_ID: ${{ vars.KODERA_ANDROID_CLIENT_ID || 'kodera-android' }}
          KODERA_ANDROID_CONSOLE_ORIGIN: ${{ vars.KODERA_ANDROID_CONSOLE_ORIGIN || 'https://community.kodera.io' }}
        run: |
          set -euo pipefail
          bash scripts/ci/check-app-resources.selftest.sh
          python3 scripts/ci/check-app-resources.py
          ./gradlew clean assembleRelease \
            -Pkodera.coreOrigin="$KODERA_ANDROID_CORE_ORIGIN" \
            -Pkodera.issuerOrigins="$KODERA_ANDROID_ISSUER_ORIGINS" \
            -Pkodera.clientId="$KODERA_ANDROID_CLIENT_ID" \
            -Pkodera.consoleOrigin="$KODERA_ANDROID_CONSOLE_ORIGIN" \
            --no-daemon
          python3 scripts/ci/check-app-resources.py \
            --merged-release app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          first_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$first_apk"
          cp "$first_apk" "$RUNNER_TEMP/first-release.apk"
          ./gradlew clean assembleRelease \
            -Pkodera.coreOrigin="$KODERA_ANDROID_CORE_ORIGIN" \
            -Pkodera.issuerOrigins="$KODERA_ANDROID_ISSUER_ORIGINS" \
            -Pkodera.clientId="$KODERA_ANDROID_CLIENT_ID" \
            -Pkodera.consoleOrigin="$KODERA_ANDROID_CONSOLE_ORIGIN" \
            --no-daemon
          second_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$second_apk"
          cp "$second_apk" "$RUNNER_TEMP/second-release.apk"
          ./gradlew --init-script ../../scripts/ci/export-android-runtime.init.gradle.kts \
            :app:exportReleaseRuntimeArtifacts \
            -PkoderaRuntimeArtifactsOut="$RUNNER_TEMP/android-runtime-artifacts.json" \
            --no-configuration-cache \
            --no-daemon
          test -s "$RUNNER_TEMP/android-runtime-artifacts.json"

      - name: Stage native packaging evidence and verify reproducible unsigned candidate APKs
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/package-android-release.py \
            --first-raw "$RUNNER_TEMP/first-release.apk" \
            --second-raw "$RUNNER_TEMP/second-release.apk" \
            --resolved-artifacts-json "$RUNNER_TEMP/android-runtime-artifacts.json" \
            --candidate-dir candidate \
            --revision "$EXPECTED_REVISION" \
            --require-configured-buildconfig
          python3 scripts/ci/check-native-packaging.py \
            --first candidate/first/package.zip \
            --second candidate/second/package.zip \
            --sbom candidate/sbom.cdx.json \
            --evidence candidate/evidence.json \
            --toolchain candidate/toolchain-lock.json \
            --revision "$EXPECTED_REVISION" \
            --target android-apk

      - name: Sign preview APK with an ephemeral key
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/kodera-release.p12" "$RUNNER_TEMP/aligned.apk"' EXIT

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "::error::ANDROID_HOME/build-tools directory is missing on runner"
            exit 1
          fi
          BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -z "$BUILD_TOOLS_DIR" ] || [ ! -x "$BUILD_TOOLS_DIR/zipalign" ] || [ ! -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            echo "::error::zipalign or apksigner missing under ANDROID_HOME/build-tools"
            exit 1
          fi
          export PATH="$BUILD_TOOLS_DIR:$PATH"

          export ANDROID_SIGNING_KEY_ALIAS="kodera-ci-dryrun"
          export ANDROID_SIGNING_STORE_PASSWORD="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/kodera-release.p12" \
            -storetype PKCS12 \
            -storepass:env ANDROID_SIGNING_STORE_PASSWORD \
            -keypass:env ANDROID_SIGNING_STORE_PASSWORD \
            -alias "$ANDROID_SIGNING_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Kodera CI Dry Run,O=Kodera"
          chmod 600 "$RUNNER_TEMP/kodera-release.p12"

          mkdir -p dist-release
          zipalign -p -f 4 candidate/first/package.zip "$RUNNER_TEMP/aligned.apk"
          apksigner sign \
            --ks "$RUNNER_TEMP/kodera-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$ANDROID_SIGNING_KEY_ALIAS" \
            --ks-pass env:ANDROID_SIGNING_STORE_PASSWORD \
            --key-pass env:ANDROID_SIGNING_STORE_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out dist-release/kodera-android.apk \
            "$RUNNER_TEMP/aligned.apk"
          apksigner verify --verbose --print-certs dist-release/kodera-android.apk
          test -s dist-release/kodera-android.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android-preview
          path: dist-release/kodera-android.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android-sbom
          path: candidate/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Bind unsigned candidate digest
        id: candidate-digest
        run: echo "sha256=$(sha256sum candidate/first/package.zip | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned-candidate
          path: candidate/first/package.zip
          if-no-files-found: error
          retention-days: 14

  android-production-sign:
    name: Android Production Signing
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: android-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure this protected environment with required reviewers, v* tag-only deployment
    # rules, and environment-scoped signing secrets before publishing a release.
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require protected release environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/release" \
            --jq '.protection_rules | any(.type == "required_reviewers" and (.reviewers | length > 0))' \
            | grep -qx true


      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned-candidate
          path: candidate/first

      - name: Verify unsigned candidate digest
        env:
          EXPECTED_PACKAGE_SHA256: ${{ needs.android-release.outputs.package_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_PACKAGE_SHA256" candidate/first/package.zip | sha256sum -c -

      - name: Sign verified release candidate
        env:
          ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          REF_FULL: ${{ github.ref }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/kodera-release.p12" "$RUNNER_TEMP/aligned.apk"' EXIT

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "::error::ANDROID_HOME/build-tools directory is missing on runner"
            exit 1
          fi
          BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -z "$BUILD_TOOLS_DIR" ] || [ ! -x "$BUILD_TOOLS_DIR/zipalign" ] || [ ! -x "$BUILD_TOOLS_DIR/apksigner" ]; then
            echo "::error::zipalign or apksigner missing under ANDROID_HOME/build-tools"
            exit 1
          fi
          export PATH="$BUILD_TOOLS_DIR:$PATH"

          case "$REF_FULL" in refs/tags/v*) ;; *) exit 1 ;; esac
          : "${ANDROID_SIGNING_KEYSTORE_B64:?release keystore required}"
          : "${ANDROID_SIGNING_KEY_ALIAS:?release alias required}"
          : "${ANDROID_SIGNING_STORE_PASSWORD:?release password required}"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_B64" | tr -d ' \t\r\n' | base64 --decode > "$RUNNER_TEMP/kodera-release.p12"
          chmod 600 "$RUNNER_TEMP/kodera-release.p12"

          mkdir -p dist-release
          zipalign -p -f 4 candidate/first/package.zip "$RUNNER_TEMP/aligned.apk"
          apksigner sign \
            --ks "$RUNNER_TEMP/kodera-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias "$ANDROID_SIGNING_KEY_ALIAS" \
            --ks-pass env:ANDROID_SIGNING_STORE_PASSWORD \
            --key-pass env:ANDROID_SIGNING_STORE_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out dist-release/kodera-android.apk \
            "$RUNNER_TEMP/aligned.apk"
          apksigner verify --verbose --print-certs dist-release/kodera-android.apk
          test -s dist-release/kodera-android.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: dist-release/kodera-android.apk
          if-no-files-found: error
          retention-days: 14

  ios-verify:
    name: iOS Release Parity & Archive Readiness
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      XCODEGEN_VERSION: "2.44.1"
      XCODEGEN_SHA256: a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify native token source and iOS app resources
        run: |
          set -euo pipefail
          python3 scripts/ci/check-native-tokens.py --selftest
          python3 scripts/ci/check-native-tokens.py
          (cd apps/ios && bash scripts/ci/check-app-resources.selftest.sh && python3 scripts/ci/check-app-resources.py)

      - name: Swift package tests (Domain, Client, Auth)
        working-directory: apps/ios/packages
        run: |
          set -euo pipefail
          for package in KoderaDomain KoderaClient KoderaAuth; do
            (cd "$package" && swift test --force-resolved-versions)
          done

      - name: Install SHA256-verified XcodeGen release
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Validate XcodeGen project generation and Release simulator build readiness
        working-directory: apps/ios
        run: |
          set -euo pipefail
          test ! -e Config/Local.xcconfig && test ! -L Config/Local.xcconfig
          xcodegen generate --spec project.yml
          xcodebuild -project Kodera.xcodeproj -scheme Kodera \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO

  publish-release:
    name: Assemble Checksums, SBOM & GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [desktop-release, android-release, android-production-sign, ios-verify]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-desktop-macos
          path: release-staging/macos

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-desktop-linux
          path: release-staging/linux

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-desktop-windows
          path: release-staging/windows

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-android
          path: release-staging/android

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-android-sbom
          path: release-staging/android-sbom

      - name: Normalize release asset filenames, assemble multi-ecosystem CycloneDX SBOM and SHA256SUMS.txt
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release-bundle
          cp release-staging/macos/kodera-desktop-macos-universal.dmg release-bundle/kodera-desktop-macos-universal.dmg
          cp release-staging/macos/kodera-desktop-macos-universal.app.tar.gz release-bundle/kodera-desktop-macos-universal.app.tar.gz
          cp release-staging/linux/kodera-desktop-linux-x86_64.AppImage release-bundle/kodera-desktop-linux-x86_64.AppImage
          cp release-staging/linux/kodera-desktop-linux-amd64.deb release-bundle/kodera-desktop-linux-amd64.deb
          cp release-staging/windows/kodera-desktop-windows-x64.msi release-bundle/kodera-desktop-windows-x64.msi
          cp release-staging/windows/kodera-desktop-windows-x64-setup.exe release-bundle/kodera-desktop-windows-x64-setup.exe
          cp release-staging/android/kodera-android.apk release-bundle/kodera-android.apk

          python3 -c 'import pathlib, sys; h = pathlib.Path("release-bundle/kodera-desktop-linux-x86_64.AppImage").read_bytes()[:16]; sys.exit(0 if h[:4] == b"\x7fELF" and h[8:11] == b"AI\x02" else "kodera-desktop-linux-x86_64.AppImage missing ELF64 + AI\\x02 Type-2 header")'
          node scripts/ci/package-desktop-release.mjs \
            --verify-appimage release-bundle/kodera-desktop-linux-x86_64.AppImage

          npm sbom --omit=dev --sbom-format=cyclonedx --package-lock-only --workspaces --include-workspace-root \
            > "$RUNNER_TEMP/npm-sbom.cdx.json"
          if ! command -v cargo >/dev/null 2>&1; then
            rustup toolchain install stable --profile minimal
            rustup default stable
          fi
          cargo metadata --locked --all-features --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
          python3 scripts/ci/assemble-release-sbom.py \
            --npm-sbom "$RUNNER_TEMP/npm-sbom.cdx.json" \
            --cargo-lock Cargo.lock \
            --cargo-metadata "$RUNNER_TEMP/cargo-metadata.json" \
            --android-sbom release-staging/android-sbom/sbom.cdx.json \
            --revision "$EXPECTED_REVISION" \
            --out release-bundle/sbom-cyclonedx.json

          (
            cd release-bundle
            sha256sum * > "$RUNNER_TEMP/SHA256SUMS.txt"
            mv "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          {
            echo "### Multi-OS Release Bundle Checksums"
            echo ""
            echo '```text'
            cat release-bundle/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kodera-release-bundle
          path: release-bundle/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_FULL: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$REF_FULL" in
            refs/tags/v*) TAG="$REF_NAME" ;;
            *) echo "::error::Release publication requires a vX.Y.Z tag ref"; exit 1 ;;
          esac
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "Kodera $TAG" --generate-notes
          gh release upload "$TAG" release-bundle/* --clobber
