name: CI — Native Mobile (iOS & Android)

# Called by ci.yml, which decides from the changed paths whether this runs and
# aggregates every result into the single required check `ci-ok`. Run alone, a
# path-filtered workflow is never reported on a pull request it skips, so a
# required check on it would wait forever.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  ios-checks:
    name: iOS Resources, Swift Packages & Simulator Build
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      XCODEGEN_VERSION: "2.44.1"
      XCODEGEN_SHA256: a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify native token source and producer provenance
        run: python3 scripts/ci/check-native-tokens.py --selftest && python3 scripts/ci/check-native-tokens.py
      - name: Verify iOS app resources
        working-directory: apps/ios
        run: |
          bash scripts/ci/check-app-resources.selftest.sh
          python3 scripts/ci/check-app-resources.py
      - name: Swift package tests (Domain, Client, Auth)
        working-directory: apps/ios/packages
        run: |
          for package in KoderaDomain KoderaClient KoderaAuth; do
            (cd "$package" && swift test --force-resolved-versions)
          done
      - name: Install the pinned XcodeGen release
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Unsigned simulator build of the app
        working-directory: apps/ios
        run: |
          test ! -e Config/Local.xcconfig && test ! -L Config/Local.xcconfig
          xcodegen generate --spec project.yml
          xcodebuild -project Kodera.xcodeproj -scheme Kodera \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO
      - name: Run hosted app tests on an available iOS simulator
        working-directory: apps/ios
        run: |
          destination=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(device["udid"] for runtime, devices in d["devices"].items() if ".iOS-" in runtime for device in devices if device["isAvailable"] and device["name"].startswith("iPhone")))')
          xcodebuild -project Kodera.xcodeproj -scheme KoderaAppTests \
            -destination "platform=iOS Simulator,id=$destination" \
            test CODE_SIGNING_ALLOWED=NO KODERA_OFFLINE_ACCESS=NO

  android-checks:
    name: Android Resource & Unit Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Verify Android app resources & unit tests
        working-directory: apps/android
        run: |
          bash scripts/ci/check-app-resources.selftest.sh
          python3 scripts/ci/check-app-resources.py
          ./gradlew test :app:processDebugMainManifest :app:processReleaseMainManifest --no-daemon
          python3 scripts/ci/check-app-resources.py --merged app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml
          python3 scripts/ci/check-app-resources.py --merged-release app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
