name: CI — Rust Core & Desktop Shell

# Called by ci.yml, which decides from the changed paths whether this runs and
# aggregates every result into the single required check `ci-ok`. Run alone, a
# path-filtered workflow is never reported on a pull request it skips, so a
# required check on it would wait forever.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust-and-desktop:
    name: Cargo Fmt, Clippy, Tests & Tauri Config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install locked workspace dependencies
        run: npm ci --ignore-scripts
      - name: Install Linux WebKitGTK and GTK3 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Ensure stable Rust toolchain with clippy & rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Verify GLib backport source, qualification guards & Cargo.lock advisories
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 security/backports/glib-0.18.5/verify.py --selftest
          python3 scripts/ci/qualify-glib-iterator.py --selftest
          python3 scripts/ci/check-cargo-advisories.py --selftest
          python3 scripts/ci/check-cargo-advisories.py
      - name: Check formatting, locked clippy, unit tests & desktop host self-check
        run: |
          cargo fmt --all -- --check
          cargo check --locked --workspace --all-targets --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked -p kodera-desktop --no-default-features
          cargo test --locked --workspace --all-targets --all-features
          cargo run --locked -p kodera-desktop --features desktop-app --bin kodera-desktop -- --self-check
          cargo run --locked -p kodera-desktop --features desktop-app --bin kodera-desktop -- --health
      - name: Qualify optimized GLib iterator and wrong-value oracle
        timeout-minutes: 7
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 scripts/ci/qualify-glib-iterator.py --execute \
            --revision "$GITHUB_SHA" --evidence "$RUNNER_TEMP/glib-iterator-evidence.json"
      - name: Verify @kodera/desktop TypeScript bridge, icons & Tauri security contract
        run: |
          node apps/desktop/scripts/verify-config.mjs --selftest
          node apps/desktop/scripts/verify-config.mjs
          node apps/desktop/scripts/generate-icons.mjs --check
          npm --workspace @kodera/desktop run typecheck
          npm --workspace @kodera/desktop run test
